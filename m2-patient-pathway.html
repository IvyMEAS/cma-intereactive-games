<style>
:root{font-family:system-ui,sans-serif;color:#183c34;background:#edf3ef}*{box-sizing:border-box}body{margin:0}header{background:#074b3c;color:#fff;padding:28px max(5vw,22px);border-bottom:6px solid #e4b84d}header small{color:#ffe4a2;letter-spacing:.13em}h1{font-size:clamp(28px,4vw,44px);margin:8px 0}main{max-width:1100px;margin:auto;padding:26px 20px}h2{margin-top:0}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}.card{background:#fff;padding:25px;border-radius:16px;box-shadow:0 5px 22px #183c340b;margin-bottom:20px}.patient{border-left:5px solid #b68a22;background:#fff8e9;padding:18px;border-radius:10px;line-height:1.6;font-size:18px}.choices{display:grid;gap:12px;margin:22px 0}button,.button{font:inherit;font-weight:650;border:0;background:#08654c;color:#fff;padding:14px 19px;border-radius:10px;cursor:pointer}.choices button{text-align:left;background:#ecf4f0;color:#163c31;border:2px solid #b6cfc0;line-height:1.5;min-height:66px}.choices button:hover:enabled{background:#d9eade;border-color:#066747}.secondary{background:#e4b84d;color:#26392e}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible{outline:4px solid #a86400;outline-offset:3px}a{color:#006747}label{display:block;font-weight:650}input,select{font:inherit;width:100%;padding:12px;border:1px solid #8aa294;border-radius:8px;margin:8px 0 18px}.muted{color:#52675f}.pill{display:inline-block;background:#dfede4;padding:7px 12px;border-radius:24px;margin:0 8px 12px 0}.timer{float:right;font-size:28px;font-weight:800}.code{font-size:44px;letter-spacing:.15em;font-weight:850}.progress{height:9px;border-radius:9px;background:#dce9e0;overflow:hidden;margin:15px 0}.progress div{height:100%;background:#c3962a}#notice{max-width:1060px;margin:12px auto;padding:14px 20px;background:#fff0c9;border-radius:10px}#notice:empty{display:none}.reaction{background:#eaf3ee;border-radius:12px;padding:18px;margin-top:18px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #dce6df}caption{text-align:left;font-weight:750;font-size:20px;margin-bottom:12px}footer{padding:24px;color:#52675f;text-align:center;font-size:14px}.small{font-size:14px}details{margin-top:16px}summary{cursor:pointer;font-weight:700}ol li{margin:10px 0;line-height:1.5}@media(max-width:500px){.card{padding:18px}.code{font-size:32px}.timer{font-size:23px}}
</style></head><body><header><small>MEAS109 · MODULE 2 · CHAPTER 4</small><h1>Patient Pathway Race</h1><div>Hear the concern. Choose your response. See what happens next.</div></header><div id="notice" role="status" aria-live="polite"></div><main id="app"></main><footer>Fictional patients · Classroom practice · Display names only · Keep the instructor tab open</footer>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
'use strict';
const CASES=[{"title":"The delayed appointment","intro":"Jordan has waited 40 minutes. In a crowded waiting room, Jordan raises their voice: “No one here cares that I left work for this.”","nodes":{"start":{"prompt":"What do you do first?","choices":[["“You have been waiting longer than expected. Would you like to talk somewhere more private?”",100,"Jordan lowers their voice: “Yes. I need to know what is happening.”","Acknowledge the frustration and offer an appropriate private conversation before trying to solve the scheduling issue.","heard"],["“Let me explain why the provider is behind, so the delay makes more sense.”",40,"Jordan interrupts: “I understand delays. I want someone to listen to me.”","An explanation may be useful later, but starting with it can sound defensive when the feeling has not been acknowledged.","repair"],["“I can look for another appointment so you do not have to wait today.”",70,"Jordan says, “Maybe, but you have not asked what I need.”","Offering a solution is constructive, but exploring the concern first avoids solving the wrong problem.","repair"],["“Please lower your voice, and then I can help with the appointment.”",20,"Jordan replies, “So my voice is the problem, not the wait?”","With no threat described, leading with a correction can increase tension. Use a calm acknowledgment before setting out next steps.","repair"]]},"heard":{"prompt":"Jordan says, “My ride leaves in 20 minutes. Can you guarantee I will be out by then?” What is the best response?","choices":[["“I will check the current timing and options with the team; I cannot promise a finish time yet.”",100,"Jordan says, “Thank you. Please find out what choices I have.”","Give an honest limit and seek information. Acknowledge the practical need without promising a time you cannot control.","plan"],["“We usually move quickly once the provider comes in, so you should be okay.”",20,"Jordan says, “Usually? I need to arrange my ride.”","A prediction can become false reassurance. Seek a realistic update and discuss options.","recover"],["“You can either keep waiting or reschedule; which do you prefer?”",60,"Jordan says, “I cannot choose without knowing how much longer.”","Offering a choice helps, but a useful choice requires available information. Check timing before pressing for a decision.","recover"],["“I understand your ride matters. Tell me more about how this has affected your day.”",70,"Jordan says, “I appreciate that, but I need a timing update now.”","Exploration was useful initially. The patient has now identified a concrete need, so move to appropriate action.","recover"]]},"repair":{"prompt":"Jordan says, “You are not hearing me. My ride leaves soon.” Which response best repairs the conversation?","choices":[["“I moved too quickly to explaining or solving it. Your ride leaves soon; what time do you need to leave?”",100,"Jordan says, “In 20 minutes. I need a realistic option.”","Own the missed concern, reflect it, and clarify the practical limit before choosing a solution.","plan"],["“I am trying to help. Please let me finish explaining the schedule.”",20,"Jordan folds their arms: “You are still explaining instead of listening.”","Defending your intention leaves the patient's concern unresolved.","recover"],["“I can put a note in the chart about the ride so the provider knows.”",60,"Jordan says, “Will anyone find out what I should do right now?”","Documenting is useful, but it does not replace clarifying and acting on the immediate need.","recover"],["“I am sorry you feel unheard. Would you like a comment card?”",40,"Jordan says, “I need help with today, not a comment card.”","A complaint route may be appropriate later. Immediate acknowledgment and practical assistance come first.","recover"]]},"plan":{"prompt":"The team gives two realistic options: a later visit today or a new appointment. Jordan chooses a new appointment. What completes service recovery?","choices":[["Confirm the new details, ask whether the plan resolves the ride concern, and explain any appropriate follow-up.",100,"Jordan repeats the new appointment details: “That works with my ride.”","Service recovery includes confirming a workable correction and following through, not just offering alternatives.",null],["Book the new time and explain which department caused the delay.",30,"Jordan knows whom to blame but remains unsure about the new plan.","Blame does not confirm that the correction meets the patient's needs.",null],["Book the time and promise that the next appointment will begin on schedule.",20,"Jordan asks, “Can you really promise that?”","Avoid guarantees about conditions you cannot control. Confirm the actual plan instead.",null],["Print the appointment slip and move on because the choice has been made.",65,"Jordan leaves with the slip but has not confirmed the details.","A printed slip supports the plan; checking understanding and whether it solves the concern completes the interaction.",null]]},"recover":{"prompt":"Jordan remains frustrated: “I need a realistic choice, not another promise.” What is the best next action?","choices":[["Acknowledge the uncertainty, obtain a current update, and review feasible options with Jordan.",100,"Jordan says, “Now I know what I can choose. Thank you.”","Recovery is still possible. Return to the unresolved need, give honest information, and involve the patient in a feasible plan.",null],["Repeat that the office is doing its best and ask Jordan to wait a little longer.",35,"Jordan says, “That still does not help me arrange transportation.”","Defending effort does not address the practical barrier.",null],["Recommend rescheduling without checking whether another option is available.",60,"Jordan agrees reluctantly but wonders whether the visit could have worked today.","A solution chosen without relevant information may overlook a better option.",null],["Ask a coworker to explain the same estimate in a more reassuring way.",45,"Jordan receives a second explanation but no reliable update.","Changing the speaker does not fix missing information or an unsupported promise.",null]]}}},{"title":"The unfinished form","intro":"At check-in, Ms. Lee returns an unfinished form and says quietly, “I forgot my glasses. Can I bring this back next time?” Other patients are nearby.","nodes":{"start":{"prompt":"How do you respond first?","choices":[["Quietly offer to review the form together in a private area and ask what would help.",100,"Ms. Lee says, “Yes, please. Some of the words are difficult.”","Offer assistance without assuming whether the barrier is vision, reading, language, or something else.","heard"],["Hand Ms. Lee a larger-print version and ask her to try again at the counter.",65,"Ms. Lee looks at the new form: “The size is not really the problem.”","Large print may help with vision, but the need has not been established. Ask what support works.","repair"],["Ask whether a family member can complete it for her at home.",45,"Ms. Lee says, “I would rather talk to someone here.”","A family member may be involved with the patient's agreement, but do not transfer the task before offering the patient accessible assistance.","repair"],["Ask directly at the counter, “Are you having trouble reading this?”",30,"Ms. Lee glances at the waiting patients and says, “Never mind.”","A public question can embarrass the patient. Make a neutral, discreet offer of help.","repair"]]},"heard":{"prompt":"In private, Ms. Lee asks you to explain the form verbally. Which approach best supports understanding?","choices":[["Explain one section at a time in plain language and invite questions before moving on.",100,"Ms. Lee says, “That makes more sense. Can we check the last part together?”","Use a manageable pace and the requested communication method, then check understanding.","plan"],["Read the full form word for word so none of its terminology changes.",60,"Ms. Lee says, “I heard the words, but I still do not know what that section means.”","Reading aloud can help, but unexplained terminology may leave the meaning unclear.","recover"],["Summarize the whole form quickly, then ask whether everything is clear.",50,"Ms. Lee nods but hesitates when asked about one section.","A broad yes/no check is less useful than checking specific understanding after small sections.","recover"],["Explain the most important section and suggest that she review the rest later.",40,"Ms. Lee says, “I still need help with the other sections.”","Prioritizing does not remove the need to make the remaining information accessible.","recover"]]},"repair":{"prompt":"Ms. Lee becomes quiet and says, “I do not want everyone knowing my business.” What should you say next?","choices":[["“We can talk privately. I can go through it with you in whatever way is helpful.”",100,"Ms. Lee agrees to speak privately: “Please explain the words, not just read them.”","Restore privacy and offer assistance without labeling the patient or requiring an explanation for needing help.","plan"],["“There is no reason to be embarrassed; lots of people cannot read forms.”",25,"Ms. Lee says, “I did not say that was my problem.”","Normalizing can still impose a label and miss the patient's request for discretion.","recover"],["“We can skip the difficult sections and ask the provider to finish them.”",50,"Ms. Lee asks, “Will I understand what I am signing?”","Passing the task along without arranging understandable information leaves the communication gap.","recover"],["“You can use the larger print in the corner; it is quieter there.”",65,"Ms. Lee says, “I need an explanation, not a different seat.”","A quieter space may help, but an assumed format does not meet the stated need.","recover"]]},"plan":{"prompt":"After reviewing instructions, which request best checks understanding without making it a reading test?","choices":[["“To check how clearly I explained it, tell me in your own words what you will do next.”",100,"Ms. Lee explains the next step accurately and asks one remaining question.","Teach-back checks the clarity of the explanation and invites the patient's own words.",null],["“Can you read this section aloud so I can check that you understand?”",35,"Ms. Lee looks uncomfortable: “I thought you were going to explain it.”","Reading ability and understanding are different. A reading test can also undermine dignity.",null],["“Does everything make sense now that we reviewed it?”",65,"Ms. Lee says yes, but her understanding has not been demonstrated.","A yes/no answer is feedback, but it gives limited evidence of what was understood.",null],["“Can you repeat the exact sentence I just used?”",50,"Ms. Lee repeats several words without explaining their meaning.","Verbatim repetition checks recall more than usable understanding.",null]]},"recover":{"prompt":"Ms. Lee nods but describes the next step incorrectly. What is the best response?","choices":[["Explain that part differently, then invite another teach-back in her own words.",100,"Ms. Lee explains the step correctly after the revised explanation.","A teach-back gap is useful feedback. Adapt the explanation and check again.",null],["Repeat the same sentence more slowly until she can repeat it.",55,"Ms. Lee repeats the sentence but remains unsure about what to do.","Slowing down may help, but repeating unchanged wording does not necessarily resolve the gap.",null],["Ask her to sign that the information has been reviewed.",25,"The form is signed, but the misunderstanding remains.","A signature does not establish understanding.",null],["Give an additional handout and suggest reviewing it with someone later.",45,"Ms. Lee leaves with more text and the same unanswered question.","More written material does not address the communication need already identified.",null]]}}},{"title":"Three people, one conversation","intro":"Mr. Rivera prefers another language. His adult daughter answers questions quickly in English. Mr. Rivera looks between you and his daughter without speaking.","nodes":{"start":{"prompt":"What is the best communication plan?","choices":[["Ask about Mr. Rivera's communication needs and arrange a qualified interpreter through the practice.",100,"With an interpreter available, Mr. Rivera begins answering directly.","Arrange support for accurate two-way communication while keeping the patient central.","heard"],["Ask the daughter to interpret and confirm that she understands the medical vocabulary.",55,"The daughter continues answering; Mr. Rivera still has little opportunity to speak.","A willing companion's fluency does not by itself establish qualified interpreting or preserve the patient's voice.","repair"],["Use short English phrases and ask the daughter to explain anything difficult.",45,"Mr. Rivera nods, but you cannot tell what he understood.","Simplifying a language the patient does not prefer may not resolve the barrier.","repair"],["Provide a translated handout and ask Mr. Rivera to point to his answers.",65,"Mr. Rivera points to the page but seems to want to ask a question.","Translated materials can support communication but do not replace a two-way conversation when one is needed.","repair"]]},"heard":{"prompt":"With the interpreter present, where should you direct the conversation?","choices":[["Address Mr. Rivera directly, use short segments, and pause for interpretation.",100,"Mr. Rivera describes his concern and asks a follow-up question.","The interpreter supports the conversation; the patient remains the person you address.","plan"],["Address the interpreter so they can decide which questions Mr. Rivera should answer.",35,"Mr. Rivera looks away as the conversation takes place about him.","The interpreter conveys communication rather than deciding the patient's questions or participation.","recover"],["Address the daughter first because she has already provided the background.",55,"The daughter answers again before Mr. Rivera can speak.","A companion can contribute with the patient's agreement, but should not displace the patient's voice.","recover"],["Give the full explanation at once so the interpreter can summarize it efficiently.",60,"Mr. Rivera asks for several parts to be repeated.","Short segments support accurate interpretation and opportunities for feedback.","recover"]]},"repair":{"prompt":"Mr. Rivera says through the interpreter, “I want to answer for myself.” What is the best next action?","choices":[["Acknowledge his preference, address him directly, and ask how he wants his daughter involved.",100,"Mr. Rivera says, “She can stay, but let me answer first.”","Respect the patient's voice and preferences about a companion's involvement.","plan"],["Explain that his daughter was helping and continue the same approach.",35,"Mr. Rivera says, “I know, but I want you to ask me.”","Defending the earlier approach does not respond to his clearly stated preference.","recover"],["Ask the daughter to leave immediately without checking Mr. Rivera's wishes.",50,"Mr. Rivera says, “I did not ask her to leave.”","Do not replace one assumption with another. Ask the patient about involvement.","recover"],["Ask the daughter to wait until the end to correct any answers.",65,"Mr. Rivera becomes hesitant about answering.","This still positions the companion as the authority over the patient's answers rather than clarifying the patient's wishes.","recover"]]},"plan":{"prompt":"After an interpreted explanation, what most directly checks Mr. Rivera's understanding?","choices":[["Invite him to explain the plan in his own words through the interpreter.",100,"Mr. Rivera explains the plan and identifies one point that needs clarification.","Teach-back remains useful in interpreted communication and should come from the patient.",null],["Ask the interpreter whether the patient appeared to understand.",55,"You have an impression of understanding, but not the patient's explanation.","The interpreter's impression is not a substitute for direct feedback from the patient.",null],["Ask the daughter whether the instructions match what she expected.",40,"The daughter agrees, but Mr. Rivera's understanding is unknown.","A companion's understanding does not establish the patient's understanding.",null],["Ask Mr. Rivera to nod if he understands each sentence.",65,"He nods, but the meaning he took from the explanation remains unclear.","Nodding provides limited feedback compared with an explanation in the patient's own words.",null]]},"recover":{"prompt":"You notice Mr. Rivera has stopped contributing while others speak. What should you do now?","choices":[["Pause, return the conversation to him, and ask what he needs clarified through the interpreter.",100,"Mr. Rivera says, “Thank you. I have a question about the last step.”","Notice the loss of patient participation and restore a direct, accessible conversation.",null],["Ask the daughter to summarize his likely concerns.",45,"The conversation continues without Mr. Rivera's own account.","Do not assume that a companion can supply the patient's individual concerns.",null],["Finish the instructions and offer questions at the next visit.",30,"Mr. Rivera leaves without raising the concern he had.","Deferring feedback leaves the current communication gap unresolved.",null],["Ask the interpreter to reassure him that the team understands the situation.",60,"Mr. Rivera says, “But I have not told you what I wanted to ask.”","Reassurance does not replace an opportunity to speak and be heard.",null]]}}},{"title":"The mixed message","intro":"During check-in, Avery says, “I am fine,” but grips the chair and gives short answers. You remember a coworker describing Avery as “always difficult.”","nodes":{"start":{"prompt":"What is your best first response?","choices":[["Set aside the coworker's label and ask, “How are you feeling about today's visit?”",100,"Avery says, “I am worried, but I do not want to make a fuss.”","Explore the individual's experience with a neutral invitation rather than interpreting behavior through a label.","heard"],["Say, “You look angry. Has something happened at the front desk?”",55,"Avery says, “I am not angry. I am scared.”","You noticed nonverbal cues, but assigned an emotion and source before checking.","repair"],["Keep the conversation brief because Avery has said everything is fine.",40,"Avery stays tense and says little else.","Respect words while also checking mixed cues gently; ending the discussion can miss a concern.","repair"],["Explain the office's expectations for respectful behavior before continuing.",20,"Avery says, “I have not done anything wrong.”","A coworker's label is not evidence of current misconduct. Do not begin with a warning unsupported by the interaction.","repair"]]},"heard":{"prompt":"Avery says, “Last time I felt no one listened. I worry this visit will be the same.” What do you say next?","choices":[["“What happened last time that you most want us to understand today?”",100,"Avery describes feeling rushed and asks for time to explain a concern.","Explore the specific experience before offering solutions or reassurance.","plan"],["“Our team works hard to listen; I am sure that was not the intention.”",30,"Avery says, “I am telling you how it felt, not what anyone intended.”","Defending the team's intentions can dismiss the patient's experience.","recover"],["“I will tell the provider you are nervous so you do not have to explain it.”",60,"Avery says, “I want to explain it myself.”","Relaying a concern can help, but do not take away the patient's voice or assume what they want.","recover"],["“Today will be different. You do not need to worry.”",40,"Avery asks, “How can you know that?”","A promise about the experience can become false reassurance. Clarify needs and take feasible action.","recover"]]},"repair":{"prompt":"Avery says, “People keep deciding what I feel before asking me.” What is the best repair?","choices":[["“I made an assumption. What would you like me to understand about how you feel?”",100,"Avery says, “I am scared I will be rushed again.”","Acknowledge the assumption and invite the patient's own account without defending it.","plan"],["“I only meant that your body language looked tense.”",45,"Avery says, “You are still explaining your assumption.”","Explaining the observation may be accurate, but it does not yet restore the patient's voice.","recover"],["“Let us start again with the check-in questions.”",60,"Avery completes check-in but leaves the concern unspoken.","Restarting tasks can avoid the emotional concern rather than repairing the interaction.","recover"],["“My coworker told me visits have been difficult for you.”",25,"Avery says, “So you were judging me before we met?”","Repeating a label can reinforce bias and reduce trust.","recover"]]},"plan":{"prompt":"Later, Avery asks for your personal social-media account so they can message you about future concerns. What is the best response?","choices":[["“Please use the practice's approved contact route; I keep my personal accounts separate from patient care.”",100,"Avery says, “Okay. Please show me which contact option to use.”","Pair a respectful professional boundary with an appropriate way to obtain help.",null],["“I can accept the request, but please do not send any details.”",35,"Avery says, “Then how will you know what I need?”","An exception still blurs personal and professional roles. Provide an approved contact route instead.",null],["“I cannot share it. You will have to find someone else to ask.”",55,"Avery says, “I still do not know how to reach the office.”","The boundary is appropriate, but it should be paired with a useful professional alternative.",null],["“Tell me the concern now, and then we can decide whether you need the account.”",65,"Avery assumes personal contact may still be possible.","Exploring the concern can be useful, but the boundary should not depend on what the patient discloses.",null]]},"recover":{"prompt":"Avery says, “I still want someone to hear what happened.” Which response best restores therapeutic communication?","choices":[["“Tell me what you most want the team to understand. Then we can identify the appropriate next step.”",100,"Avery explains the concern and agrees on how it should be shared with the team.","Listen before selecting a solution, then route the concern appropriately within the MA's role.",null],["“The provider will have more time to listen than I do.”",55,"Avery says, “I was hoping you would listen now.”","Routing can be appropriate, but simply passing the patient along may repeat the feeling of being dismissed.",null],["“If you write a complaint, someone will review it.”",60,"Avery receives a process but no acknowledgment of the immediate concern.","A formal route can be useful after the concern is heard and the patient's need is clarified.",null],["“I understand. We all have visits that do not go as planned.”",35,"Avery says, “This is about what happened to me.”","A general statement may minimize the individual experience instead of inviting it.",null]]}}}];
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let peer,connection,role='',phase='home',room='',limit=45,players=new Map(),self=null,latest=[],clock,waiting,peerReady=false;
const MAX=CASES.length*3;
function notice(s){$('notice').textContent=s}
function show(s){$('app').innerHTML=s}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function progress(p){return p.finished?MAX:p.caseIndex*3+p.step}
function rows(){const list=[...players.values()].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));return list.map((p,i)=>({name:p.name,score:p.score,progress:progress(p),finished:p.finished,online:!!p.conn?.open,rank:1+list.filter(x=>x.score>p.score).length}))}
function board(list){return '<table><caption>Live leaderboard</caption><thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Points</th><th scope="col">Progress</th></tr></thead><tbody>'+list.map(p=>'<tr><td>'+p.rank+'</td><td>'+esc(p.name)+(p.online===false?' · offline':'')+'</td><td>'+p.score+'</td><td>'+p.progress+'/'+MAX+(p.finished?' ✓':'')+'</td></tr>').join('')+'</tbody></table>'}
function home(){phase='home';show('<div class="grid"><section class="card"><h2>Join your class</h2><p>Enter the six-character code and the name you want on the leaderboard.</p><form id="joinForm"><label>Game code<input id="code" required maxlength="6" value="'+esc(new URLSearchParams(location.search).get('room')||'')+'" autocomplete="off"></label><label>Display name<input id="name" required maxlength="24" autocomplete="nickname"></label><button>Join pathway race</button></form></section><section class="card"><h2>Instructor launch</h2><p>Four encounters. Twelve decisions. Every student follows their own pathway after you start.</p><label>Time per decision<select id="limit"><option>30</option><option selected>45</option><option>60</option><option>90</option></select></label><button id="host">Host live race</button> <button id="solo" class="secondary">Try solo</button><details><summary>How to run the race</summary><ol><li>Host a race and share the join link or code.</li><li>Wait for students, then select Start race.</li><li>Students choose a response, read the patient reaction, and continue independently.</li><li>Discuss the different paths and download results before closing.</li></ol><p>Choices earn 0–100 judgment points. There is no speed bonus. Tied scores share a rank. A timeout earns zero, then offers a recovery path. Reading feedback is untimed.</p><p class="muted small">Live play needs internet and browser-to-browser connections. Test on classroom Wi-Fi. Reloading loses the session; save the results before closing. This uses display names rather than authenticated accounts and does not send grades to Canvas.</p></details></section></div><section class="card"><h2>Your four encounters</h2><div class="grid">'+CASES.map((c,i)=>'<div><span class="pill">Encounter '+(i+1)+'</span><h3>'+esc(c.title)+'</h3></div>').join('')+'</div><p>Each route has three scored decisions. You can recover from an earlier choice; the next question and patient response follow the route you take.</p></section>');$('joinForm').onsubmit=e=>{e.preventDefault();join()};$('host').onclick=host;$('solo').onclick=solo}
function newPlayer(name,conn){return {name,conn,caseIndex:0,step:0,node:'start',score:0,finished:false,answering:false,review:false,history:[],lastReaction:'',deadline:0,order:[]}}
function makeDecision(p){if(p.caseIndex>=CASES.length){p.finished=true;return null}const c=CASES[p.caseIndex],node=c.nodes[p.node];p.order=shuffle(node.choices.map((_,i)=>i));p.answering=true;p.review=false;p.deadline=Date.now()+limit*1000;return {type:'decision',caseTitle:c.title,intro:c.intro,caseIndex:p.caseIndex,step:p.step,node:p.node,prompt:node.prompt,choices:p.order.map(i=>node.choices[i][0]),seconds:limit,score:p.score,lastReaction:p.lastReaction}}
function send(p,msg){if(role==='solo')handle(msg);else if(p.conn?.open)p.conn.send(msg)}
function deliver(p){clearTimeout(p.timeout);const data=makeDecision(p);if(!data){send(p,{type:'done',score:p.score,history:p.history,rows:role==='solo'?[]:rows()});if(role==='host'){update();checkComplete()}return}send(p,data);if(role==='host')p.timeout=setTimeout(()=>submit(p,{node:p.node,caseIndex:p.caseIndex,choice:-1}),limit*1000)}
function submit(p,d){if(!p.answering||p.finished||d.node!==p.node||d.caseIndex!==p.caseIndex||!Number.isInteger(d.choice)||d.choice< -1||d.choice>3)return;p.answering=false;clearTimeout(p.timeout);const c=CASES[p.caseIndex],n=c.nodes[p.node],timed=d.choice===-1||Date.now()>p.deadline,original=timed?-1:p.order[d.choice],choice=original<0?null:n.choices[original];const best=n.choices.find(x=>x[1]===100),points=choice?choice[1]:0;p.score+=points;const reaction=choice?choice[2]:'The patient waits without receiving a response. You now have a chance to continue the conversation.';const feedback=choice?choice[3]:'No answer was received within the time limit. The next step lets you practice recovering the interaction.';p.next=choice?choice[4]:(p.step===0?'repair':p.step===1?'recover':null);p.lastReaction=reaction;p.review=true;p.history.push({caseTitle:c.title,prompt:n.prompt,selected:choice?choice[0]:'Time expired',points,reaction,feedback,best:best[0]});send(p,{type:'feedback',points,score:p.score,reaction,feedback,best:best[0],caseEnd:p.next===null,finishedCount:p.caseIndex*3+p.step+1});if(role==='host')update()}
function advance(p){if(!p.review||p.finished)return;p.review=false;if(p.next===null){p.caseIndex++;p.step=0;p.node='start';p.lastReaction=''}else{p.node=p.next;p.step++}deliver(p);if(role==='host')update()}
function solo(){limit=Number($('limit').value);role='solo';phase='playing';notice('Solo practice · scores are only on this device.');self=newPlayer('You',null);deliver(self)}
function setupPeer(id){if(!window.Peer){notice('The connection service did not load. Try solo or check your internet connection.');return false}if(peer)peer.destroy();peerReady=false;peer=id?new Peer(id):new Peer();peer.on('error',e=>{notice('Live connection issue ('+e.type+'). Check the code and network. If needed, open a fresh race.');if($('joinButton'))$('joinButton').disabled=false});peer.on('disconnected',()=>notice('Live connection interrupted. Keep this page open and check the network.'));return true}
function host(){limit=Number($('limit').value);role='host';phase='opening';room=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');if(!setupPeer('ivy-path-'+room))return;show('<section class="card"><h2>Opening your race…</h2><p>Connecting to the classroom service.</p></section>');peer.on('open',()=>{peerReady=true;phase='lobby';notice('Room ready. Invite your students.');hostView()});peer.on('connection',conn=>{conn.on('data',d=>receive(conn,d));conn.on('close',()=>{const p=players.get(conn.peer);if(p){p.conn=null;update()}})})}
function receive(conn,d){if(!d||typeof d!=='object')return;if(d.type==='join'){if(phase!=='lobby'){conn.send({type:'error',text:'This race has already started. Join the next round.'});return}if(players.has(conn.peer))return;const name=String(d.name||'').trim().slice(0,24);if(!name||[...players.values()].some(p=>p.name.toLowerCase()===name.toLowerCase())){conn.send({type:'error',text:'Choose a display name that is not already in this room.'});return}if(players.size>=60){conn.send({type:'error',text:'This room has reached its 60-player limit.'});return}const p=newPlayer(name,conn);players.set(conn.peer,p);conn.send({type:'welcome'});update();return}if(phase!=='playing')return;const p=players.get(conn.peer);if(!p)return;if(d.type==='answer')submit(p,d);if(d.type==='next')advance(p)}
function update(){const list=rows();for(const p of players.values())if(p.conn?.open)p.conn.send({type:'board',rows:list});if(role==='host')hostView()}
function checkComplete(){if(phase==='playing'&&[...players.values()].every(p=>p.finished))endRace()}
function hostView(){const list=rows(),joinUrl=location.origin+location.pathname+'?room='+room;show('<section class="card"><span class="pill">Instructor console</span><h2>'+(phase==='lobby'?'Ready for your class':phase==='finished'?'Race results':'Pathways in progress')+'</h2><div class="code">'+room+'</div><p>Student link: <a target="_blank" rel="noopener" href="'+esc(joinUrl)+'">'+esc(joinUrl)+'</a></p><p>'+players.size+' players · '+[...players.values()].filter(p=>p.conn?.open).length+' connected · '+limit+' seconds per decision</p><div id="controls"></div></section><section class="card">'+board(list)+'</section><section class="card"><h2>Debrief prompts</h2><p>Which response changed the conversation? Where did listening need to become action? How did you repair a missed concern?</p><p class="muted">Routes vary. Students are ranked by judgment points, not finishing speed. Keep this tab open; download results before you leave.</p></section>');if(phase==='lobby'){$('controls').innerHTML='<button id="start" '+(!list.some(p=>p.online)?'disabled':'')+'>Start race</button>';$('start').onclick=()=>{for(const [id,p] of players)if(!p.conn?.open)players.delete(id);phase='playing';notice('Race started. Students advance independently.');for(const p of players.values())deliver(p);update()}}else if(phase==='playing'){$('controls').innerHTML='<button id="end" class="secondary">End race and show results</button>';$('end').onclick=endRace}else{$('controls').innerHTML='<button id="results">Download results</button> <button id="new" class="secondary">New race</button>';$('results').onclick=exportResults;$('new').onclick=()=>{peer.destroy();players.clear();role='';notice('');home()}}}
function endRace(){phase='finished';notice('Race ended. Download results before closing.');for(const p of players.values()){clearTimeout(p.timeout);p.answering=false;p.review=false;send(p,{type:'done',score:p.score,history:p.history,rows:rows()})}update()}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportResults(){const cell=x=>'"'+(' '+String(x)).replace(/"/g,'""')+'"';const csv=[['Rank','Display name','Points','Decisions answered','Finished'].join(',')];for(const r of rows()){const p=[...players.values()].find(p=>p.name===r.name);csv.push([r.rank,cell(r.name),r.score,p.history.length,p.finished?'Yes':'No'].join(','))}download('patient-pathway-results.csv',csv.join('\r\n'),'text/csv')}
function join(){const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim();if(!/^[A-Z2-9]{6}$/.test(code)||!name){notice('Enter a six-character room code and a display name.');return}role='student';phase='joining';if(!setupPeer())return;notice('Connecting to your instructor…');clearTimeout(waiting);waiting=setTimeout(()=>{if(phase==='joining')notice('Still connecting. Check the code and ask your instructor to keep the room open. Your network may block live connections.')},15000);peer.on('open',()=>{connection=peer.connect('ivy-path-'+code,{reliable:true});connection.on('open',()=>connection.send({type:'join',name}));connection.on('data',handle);connection.on('close',()=>{clearInterval(clock);notice('The instructor connection closed. Ask the instructor about starting a new round.');document.querySelectorAll('.choices button').forEach(b=>b.disabled=true);if($('next'))$('next').disabled=true})})}
let active=null,submitted=false;
function handle(d){if(!d||typeof d!=='object')return;if(d.type==='error'){clearTimeout(waiting);phase='home';notice(d.text);return}if(d.type==='welcome'){clearTimeout(waiting);phase='lobby';notice('');show('<section class="card"><h2>You’re in!</h2><p>Wait for your instructor to start the race. Each choice changes what the patient says and which decision you face next.</p></section><section id="leader" class="card"></section>')}if(d.type==='board'){latest=d.rows;if($('leader'))$('leader').innerHTML=board(latest)}if(d.type==='decision'){phase='playing';decision(d)}if(d.type==='feedback')feedback(d);if(d.type==='done')done(d)}
function decision(d){clearInterval(clock);active=d;submitted=false;const began=Date.now();show('<section class="card"><span class="pill">Encounter '+(d.caseIndex+1)+' of '+CASES.length+'</span><span class="pill">Decision '+(d.step+1)+' of 3</span><span id="clock" class="timer">'+d.seconds+'s</span><div class="progress"><div id="bar" style="width:100%"></div></div><h2>'+esc(d.caseTitle)+'</h2><p class="patient">'+esc(d.step===0?d.intro:d.lastReaction)+'</p><h3>'+esc(d.prompt)+'</h3><div class="choices">'+d.choices.map((c,i)=>'<button data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(c)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div><p class="muted">Current score: '+d.score+' · No speed bonus—use the time to think.</p></section><section id="leader" class="card">'+(role==='solo'?'Solo practice · each response can earn up to 100 points.':board(latest))+'</section>');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));clock=setInterval(()=>{const left=Math.max(0,d.seconds-(Date.now()-began)/1000);$('clock').textContent=Math.ceil(left)+'s';$('bar').style.width=100*left/d.seconds+'%';if(left<=0)answer(-1)},100)}
function answer(choice){if(submitted||!active||phase!=='playing')return;submitted=true;clearInterval(clock);document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);const d={type:'answer',node:active.node,caseIndex:active.caseIndex,choice};if(role==='solo')submit(self,d);else if(connection?.open){$('feedback').textContent='Response sent…';connection.send(d)}else notice('Connection lost. Please let your instructor know.')}
function feedback(d){clearInterval(clock);submitted=true;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);if(!$('feedback'))return;$('feedback').innerHTML='<div class="reaction"><span class="pill">+'+d.points+' judgment points</span><h3>The patient responds</h3><p>'+esc(d.reaction)+'</p><h3>Why this matters</h3><p>'+esc(d.feedback)+'</p>'+(d.points<100?'<p><strong>Best response:</strong> '+esc(d.best)+'</p>':'')+'<p>Total: '+d.score+' points · '+d.finishedCount+'/'+MAX+' decisions</p><button id="next">'+(d.caseEnd?(d.finishedCount>=MAX?'See results':'Next patient'):'Continue conversation')+'</button></div>';$('next').onclick=()=>{$('next').disabled=true;if(role==='solo')advance(self);else if(connection?.open)connection.send({type:'next'})}}
function done(d){clearInterval(clock);active=null;phase='finished';show('<section class="card"><h2>Your pathway review</h2><p class="timer">'+d.score+' / '+(MAX*100)+'</p><p>'+d.history.length+' of '+MAX+' decisions completed. Every encounter is a chance to practice listening, adapting, and recovering.</p><button id="reviewSave" class="secondary">Download my review</button>'+(role==='solo'?' <button id="back">Back to launch</button>':'<p>You may finish before classmates; live rankings continue to update.</p>')+'</section><section class="card"><h2>Revisit your decisions</h2>'+d.history.map((h,i)=>'<details><summary>'+ (i+1)+'. '+esc(h.caseTitle)+' · '+h.points+' points</summary><p><strong>Decision:</strong> '+esc(h.prompt)+'</p><p><strong>Your response:</strong> '+esc(h.selected)+'</p><p><strong>Patient reaction:</strong> '+esc(h.reaction)+'</p><p>'+esc(h.feedback)+'</p><p><strong>Best response:</strong> '+esc(h.best)+'</p></details>').join('')+'</section>'+(role==='solo'?'':'<section id="leader" class="card">'+board(d.rows||latest)+'</section>'));$('reviewSave').onclick=()=>download('my-pathway-review.txt',d.history.map((h,i)=>(i+1)+'. '+h.caseTitle+'\n'+h.prompt+'\nYour response: '+h.selected+'\nPatient: '+h.reaction+'\n'+h.feedback+'\nBest response: '+h.best+'\nPoints: '+h.points).join('\n\n'),'text/plain');if($('back'))$('back').onclick=()=>{role='';notice('');home()}}
window.addEventListener('beforeunload',e=>{if(peer&&phase!=='home'){e.preventDefault();e.returnValue=''}});
home();
</script></body></html>
