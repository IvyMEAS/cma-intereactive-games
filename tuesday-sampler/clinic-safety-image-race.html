  })};
}
function create(solo){if(solo){note('This game is available only during a live class review.');return}if(!instructorAccess){note('Open the instructor launch link in Canvas to host.');return}deck=shuffleDeckAnswers(decks[Number($('deck').value)]);mode=$('mode').value;seconds=Number($('seconds').value);local=solo;note('');if(solo){host=false;ownScore=0;index=0;phase='playing';question(deck.questions[0],0);return}if(!window.Peer){note('The live connection service did not load. Check your connection or try solo.');return}host=true;phase='lobby';room=Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');peer=new Peer('ivy-cma-safety-sampler-'+room);peer.on('open',()=>{hostView();note('Room ready. Students can join now.')});peer.on('error',e=>note('Connection problem: '+e.type+'. Please return home and try again.'));peer.on('connection',c=>{c.on('data',d=>receive(c,d));c.on('close',()=>{let p=players.get(c.peer);if(p){p.c=null;broadcast()}})});view('<section class="card"><h2>Opening your classroom…</h2></section>')}
function hostView(){view('<section class="card"><span class="pill">'+esc(deck.title)+'</span><span class="pill">'+(mode==='race'?'Independent race':'Instructor paced')+'</span><h2>'+(phase==='lobby'?'Your class is invited':phase==='finished'?'Final results':'Game in progress')+'</h2><div class="code">'+room+'</div><div class="join-panel"><div><h3>Scan to join</h3><div id="joinQr" class="join-qr" role="img" aria-label="QR code to join this game" data-join-url="'+esc(location.origin+location.pathname+'?room='+room)+'"></div></div><div class="join-steps"><h3>Or open IvyLearn</h3><p>In <strong>Games</strong>, open <strong>Clinic Safety Image Race · Created by ChatGPT</strong>.</p><p>Enter the <strong>six-character code above</strong> and your display name.</p><a class="button" target="_blank" rel="noopener" href="'+esc(location.origin+location.pathname+'?room='+room)+'">Open student join page</a></div></div><p>'+players.size+' players · '+[...players.values()].filter(p=>p.c?.open).length+' connected</p><div id="controls"></div></section><section class="card" id="hostQuestion"></section><section class="card">'+board(ranks())+'</section>');if(phase==='lobby'){$('controls').innerHTML='<button id="start" '+(!players.size?'disabled':'')+'>Start game</button>';$('start').onclick=()=>{phase='playing';note('Game started. Keep this tab open.');startAt=Date.now();index=0;for(const p of players.values()){p.i=0;p.score=0;sendQuestion(p)}broadcast();if(mode==='paced')schedulePaced()}}else if(phase==='playing'){$('controls').innerHTML='<button id="end">End game and show results</button>';$('end').onclick=finish;if(mode==='paced'){$('hostQuestion').innerHTML='<p>Question '+(index+1)+' of '+deck.questions.length+'</p><h2>'+esc(deck.questions[index][0])+'</h2><div class="answers">'+deck.questions[index][1].map(c=>'<div class="card">'+esc(c)+'</div>').join('')+'</div><p id="hostTime" class="timer"></p>';if([...players.values()].every(p=>p.answered)){$('hostQuestion').innerHTML+='<p>Correct answer: '+esc(deck.questions[index][1][deck.questions[index][2]])+'</p><p>'+esc(deck.questions[index][3])+'</p><button id="next">Next question</button>';$('next').onclick=nextPaced}}else{$('hostQuestion').innerHTML='<h2>Students are racing independently</h2><p>Each question has a '+seconds+'-second limit. Correct answers earn 1,000 points. Faster correct answers earn up to 500 bonus points.</p>'}}else{$('controls').innerHTML='<button id="csv">Download results</button> <button class="secondary" id="again">New game</button>';$('csv').onclick=()=>download('classroom-results.csv','Rank,Display name,Points\r\n'+ranks().map((p,i)=>[i+1,'"'+(' '+p.name).replace(/"/g,'""')+'"',p.score].join(',')).join('\r\n'),'text/csv');$('again').onclick=()=>location.href=location.pathname}}
function receive(c,d){if(!d||typeof d!=='object')return;if(d.type==='join'){if(phase!=='lobby'){c.send({type:'error',message:'This game has started. Join the next round.'});return}if(players.has(c.peer))return;const name=String(d.name||'').trim().slice(0,24);if(!name)return;if([...players.values()].some(p=>p.name.toLowerCase()===name.toLowerCase())){c.send({type:'error',message:'That display name is taken. Add an initial or number.'});return}if(players.size>=60){c.send({type:'error',message:'This room is full.'});return}players.set(c.peer,{c,name,score:0,i:0,answered:false});c.send({type:'welcome',title:deck.title});broadcast()}const p=players.get(c.peer);if(!p||phase!=='playing')return;if(d.type==='answer')grade(p,d);if(d.type==='next'&&mode==='race'&&p.answered){p.i++;sendQuestion(p);broadcast();if([...players.values()].every(x=>x.i>=deck.questions.length))finish()}}
function sendQuestion(p){if(p.i>=deck.questions.length){p.c?.send({type:'done',score:p.score,rows:ranks()});return}p.answered=false;p.result=null;p.sent=Date.now();p.c?.send({type:'question',q:deck.questions[p.i][0],choices:deck.questions[p.i][1],i:p.i,total:deck.questions.length,seconds,mode});}
function grade(p,d){if(p.answered||d.i!==p.i||!Number.isInteger(d.choice)||d.choice< -1||d.choice>3)return;p.answered=true;const q=deck.questions[p.i],elapsed=Date.now()-p.sent,correct=d.choice===q[2]&&elapsed<=seconds*1000;const points=correct?100:0;p.score+=points;p.result={type:'result',correct,answer:q[1][q[2]],feedback:q[3],points,score:p.score,mode};p.c?.send(p.result);broadcast()}
function schedulePaced(){clearTimeout(timer);timer=setTimeout(()=>{for(const p of players.values())if(!p.answered)grade(p,{i:p.i,choice:-1});hostView()},seconds*1000)}
function nextPaced(){index++;if(index>=deck.questions.length){finish();return}for(const p of players.values()){p.i=index;sendQuestion(p)}hostView();schedulePaced()}
function finish(){phase='finished';note('Game ended. Download results before closing this tab.');clearTimeout(timer);for(const p of players.values())p.c?.send({type:'done',score:p.score,rows:ranks()});hostView()}
function join(){if(!window.Peer){note('Live connections are unavailable. Please try again later.');return}const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim();if(!/^[A-Z2-9]{6}$/.test(code)||!name){note('Enter a six-character code and a display name.');return}host=false;local=false;phase='joining';if(peer)peer.destroy();peer=new Peer();note('Connecting to your instructor…');peer.on('open',()=>{link=peer.connect('ivy-cma-safety-sampler-'+code,{reliable:true});link.on('open',()=>link.send({type:'join',name}));link.on('data',studentReceive);link.on('close',()=>{clearInterval(timer);note('Disconnected from the instructor. Ask the instructor to start a new round.');document.querySelectorAll('.answers button').forEach(b=>b.disabled=true)})});peer.on('error',()=>note('Could not connect. Check the code and ask your instructor to keep the game open. Your network may block live connections.'));}
let latestRows=[];
function studentReceive(d){if(d.type==='error'){note(d.message);return}if(d.type==='welcome'){note('');phase='lobby';view('<section class="card"><h2>You’re in!</h2><p>'+esc(d.title)+'</p><p>Waiting for your instructor to start…</p></section><section id="leader" class="card"></section>')}if(d.type==='board'){latestRows=d.rows;if($('leader'))$('leader').innerHTML=board(d.rows)}if(d.type==='question'){phase='playing';index=d.i;seconds=d.seconds;mode=d.mode;question([d.q,d.choices],d.i,d.total)}if(d.type==='result')result(d);if(d.type==='done'){clearInterval(timer);phase='finished';view('<section class="card"><h2>Challenge complete!</h2><p class="timer">'+d.score+' points</p><p>Well done—review the feedback and keep practicing.</p></section><section id="leader" class="card">'+board(d.rows)+'</section>')}}
function question(q,i,total=deck?.questions.length){clearInterval(timer);answered=false;const stamp=++session;startAt=Date.now();view('<section class="card"><span class="pill">Question '+(i+1)+' of '+total+'</span><span id="clock" class="timer">'+seconds+'</span><div class="progress"><div id="bar" style="width:100%"></div></div><h2>'+esc(q[0])+'</h2><img style="display:block;width:min(100%,620px);height:auto;border-radius:10px;margin:0 auto 16px" width="760" height="450" src="'+esc(roomImage)+'" alt="Exam room. A wet patch is on the walking path, a supply carton sits in the exit, a cord has damaged insulation, and a chair is off the walking path."><div class="answers">'+q[1].map((c,j)=>'<button data-choice="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(c)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section><section id="leader" class="card">'+(latestRows.length?board(latestRows):'Your score will appear after your answer.')+'</section>');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)));timer=setInterval(()=>{if(stamp!==session)return;const remaining=Math.max(0,seconds-(Date.now()-startAt)/1000);$('clock').textContent=Math.ceil(remaining);$('bar').style.width=(remaining/seconds*100)+'%';if(remaining<=0)answer(-1)},100)}
function answer(choice){if(answered||phase!=='playing')return;answered=true;clearInterval(timer);document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);if(local){const q=deck.questions[index],elapsed=Date.now()-startAt,correct=choice===q[2]&&elapsed<=seconds*1000,points=correct?1000+Math.max(0,Math.round(500*(1-elapsed/(seconds*1000)))):0;ownScore+=points;result({correct,answer:q[1][q[2]],feedback:q[3],points,score:ownScore,mode:'race'})}else if(link?.open){$('feedback').textContent='Answer sent…';link.send({type:'answer',choice,i:index})}}
function result(d){clearInterval(timer);answered=true;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);if(!$('feedback'))return;$('feedback').innerHTML='<h3>'+(d.correct?'Correct! +'+d.points:'Keep learning')+'</h3><p><strong>Answer: '+esc(d.answer)+'</strong></p><p>'+esc(d.feedback)+'</p><p>Total: '+d.score+' points</p>'+(d.mode==='race'?'<button id="continue">Continue</button>':'<p>Wait for your instructor to advance.</p>');if($('continue'))$('continue').onclick=()=>{if(local){index++;if(index<deck.questions.length)question(deck.questions[index],index);else{phase='finished';view('<section class="card"><h2>Practice complete!</h2><p class="timer">'+ownScore+' points</p><button id="home">Back to games</button></section>');$('home').onclick=home}}else{ $('continue').disabled=true;link.send({type:'next'})}}}
window.addEventListener('beforeunload',e=>{if(peer&&phase!=='home'){e.preventDefault();e.returnValue=''}});home();unlockInstructor();
</script></html>
