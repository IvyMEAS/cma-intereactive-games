const CASES=[{"title": "Clarification", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Clarification", "choices": [["Checking the meaning of an unclear word or statement", 100, "Correct match.", "Checking the meaning of an unclear word or statement", "apply"], ["Reflecting the patient's message in different words", 0, "Review the distinction before applying it.", "Best match: Checking the meaning of an unclear word or statement", "apply"], ["Narrowing a discussion to one topic", 0, "Review the distinction before applying it.", "Best match: Checking the meaning of an unclear word or statement", "apply"], ["Inviting the patient to start with any concern", 0, "Review the distinction before applying it.", "Best match: Checking the meaning of an unclear word or statement", "apply"]]}, "apply": {"prompt": "A patient says, “My instructions are confusing.” Which response best uses clarification?", "choices": [["“Which part feels confusing to you?”", 100, "Correct application.", "Clarification identifies what an unclear statement means. Restatement reflects the message; focusing narrows the subject; a broad opening invites a topic.", null], ["“You feel unsure about the instructions.”", 0, "Review the best answer and its rationale.", "Clarification identifies what an unclear statement means. Restatement reflects the message; focusing narrows the subject; a broad opening invites a topic.", null], ["“Let us focus on the first page.”", 0, "Review the best answer and its rationale.", "Clarification identifies what an unclear statement means. Restatement reflects the message; focusing narrows the subject; a broad opening invites a topic.", null], ["“Tell me about your visit today.”", 0, "Review the best answer and its rationale.", "Clarification identifies what an unclear statement means. Restatement reflects the message; focusing narrows the subject; a broad opening invites a topic.", null]]}}}, {"title": "Restatement", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Restatement", "choices": [["Reflecting the substance of a patient's message in different words", 100, "Correct match.", "Reflecting the substance of a patient's message in different words", "apply"], ["Asking the patient to define an unclear expression", 0, "Review the distinction before applying it.", "Best match: Reflecting the substance of a patient's message in different words", "apply"], ["Directing attention to a specific subject", 0, "Review the distinction before applying it.", "Best match: Reflecting the substance of a patient's message in different words", "apply"], ["Offering information to answer a factual question", 0, "Review the distinction before applying it.", "Best match: Reflecting the substance of a patient's message in different words", "apply"]]}, "apply": {"prompt": "A patient says, “I cannot manage work and all these visits.” Which response best uses restatement?", "choices": [["“Keeping up with work and appointments feels difficult.”", 100, "Correct application.", "Restatement preserves the message without adding a judgment or solution. Clarifying, focusing, and providing information are different techniques that may follow.", null], ["“What does ‘cannot manage’ mean for you?”", 0, "Review the best answer and its rationale.", "Restatement preserves the message without adding a judgment or solution. Clarifying, focusing, and providing information are different techniques that may follow.", null], ["“Which visit should we discuss first?”", 0, "Review the best answer and its rationale.", "Restatement preserves the message without adding a judgment or solution. Clarifying, focusing, and providing information are different techniques that may follow.", null], ["“Our scheduling desk can explain available times.”", 0, "Review the best answer and its rationale.", "Restatement preserves the message without adding a judgment or solution. Clarifying, focusing, and providing information are different techniques that may follow.", null]]}}}, {"title": "Therapeutic silence", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Therapeutic silence", "choices": [["An attentive pause that gives a patient time to continue", 100, "Correct match.", "An attentive pause that gives a patient time to continue", "apply"], ["Redirecting a discussion toward one concern", 0, "Review the distinction before applying it.", "Best match: An attentive pause that gives a patient time to continue", "apply"], ["Repeating the patient's last message in other words", 0, "Review the distinction before applying it.", "Best match: An attentive pause that gives a patient time to continue", "apply"], ["Changing subjects to reduce discomfort", 0, "Review the distinction before applying it.", "Best match: An attentive pause that gives a patient time to continue", "apply"]]}, "apply": {"prompt": "A patient says, “There is something else…” and pauses while looking as if they want to continue. What is the best initial action?", "choices": [["Stay attentive and allow a brief pause before prompting", 100, "Correct application.", "An attentive pause makes room for disclosure without steering it. Prompts can help later, but immediately filling the silence may interrupt the patient's next thought.", null], ["Offer several examples of concerns they might mean", 0, "Review the best answer and its rationale.", "An attentive pause makes room for disclosure without steering it. Prompts can help later, but immediately filling the silence may interrupt the patient's next thought.", null], ["Ask a specific question about the previous topic", 0, "Review the best answer and its rationale.", "An attentive pause makes room for disclosure without steering it. Prompts can help later, but immediately filling the silence may interrupt the patient's next thought.", null], ["Summarize the visit and invite a later portal message", 0, "Review the best answer and its rationale.", "An attentive pause makes room for disclosure without steering it. Prompts can help later, but immediately filling the silence may interrupt the patient's next thought.", null]]}}}, {"title": "False reassurance", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: False reassurance", "choices": [["Offering an unsupported promise that a feared outcome will not occur", 100, "Correct match.", "Offering an unsupported promise that a feared outcome will not occur", "apply"], ["Recognizing a patient's feeling without predicting an outcome", 0, "Review the distinction before applying it.", "Best match: Offering an unsupported promise that a feared outcome will not occur", "apply"], ["Explaining an established next step in the visit", 0, "Review the distinction before applying it.", "Best match: Offering an unsupported promise that a feared outcome will not occur", "apply"], ["Inviting a patient to describe a particular worry", 0, "Review the distinction before applying it.", "Best match: Offering an unsupported promise that a feared outcome will not occur", "apply"]]}, "apply": {"prompt": "A patient says, “I am afraid the results will be serious.” Which reply is the clearest example of false reassurance?", "choices": [["“I am sure the results will be nothing to worry about.”", 100, "Correct application.", "A positive-sounding promise about unknown results is false reassurance. Empathy, exploration, and factual information do not guarantee an outcome.", null], ["“What possibility worries you most?”", 0, "Review the best answer and its rationale.", "A positive-sounding promise about unknown results is false reassurance. Empathy, exploration, and factual information do not guarantee an outcome.", null], ["“Waiting for results sounds difficult.”", 0, "Review the best answer and its rationale.", "A positive-sounding promise about unknown results is false reassurance. Empathy, exploration, and factual information do not guarantee an outcome.", null], ["“The provider will discuss the results with you when available.”", 0, "Review the best answer and its rationale.", "A positive-sounding promise about unknown results is false reassurance. Empathy, exploration, and factual information do not guarantee an outcome.", null]]}}}, {"title": "Displacement", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Displacement", "choices": [["Redirecting an emotion from its original source toward another target", 100, "Correct match.", "Redirecting an emotion from its original source toward another target", "apply"], ["Attributing one's own feelings to another person", 0, "Review the distinction before applying it.", "Best match: Redirecting an emotion from its original source toward another target", "apply"], ["Returning to an earlier behavior pattern under stress", 0, "Review the distinction before applying it.", "Best match: Redirecting an emotion from its original source toward another target", "apply"], ["Giving a plausible excuse for behavior", 0, "Review the distinction before applying it.", "Best match: Redirecting an emotion from its original source toward another target", "apply"]]}, "apply": {"prompt": "After distressing family news, a patient snaps at the MA about a minor paperwork delay. Which interpretation and response best fit?", "choices": [["Possible displacement; acknowledge distress and address the concern calmly", 100, "Correct application.", "Emotion redirected from the family event to the MA suggests displacement. Recognizing a possible mechanism guides a supportive response; it is not a diagnosis.", null], ["Possible projection; ask why the patient believes the MA is upset", 0, "Review the best answer and its rationale.", "Emotion redirected from the family event to the MA suggests displacement. Recognizing a possible mechanism guides a supportive response; it is not a diagnosis.", null], ["Possible regression; take over the patient's familiar tasks", 0, "Review the best answer and its rationale.", "Emotion redirected from the family event to the MA suggests displacement. Recognizing a possible mechanism guides a supportive response; it is not a diagnosis.", null], ["Possible rationalization; challenge the excuse for the reaction", 0, "Review the best answer and its rationale.", "Emotion redirected from the family event to the MA suggests displacement. Recognizing a possible mechanism guides a supportive response; it is not a diagnosis.", null]]}}}, {"title": "Regression", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Regression", "choices": [["Returning to an earlier pattern of behavior during stress", 100, "Correct match.", "Returning to an earlier pattern of behavior during stress", "apply"], ["Rejecting a distressing reality", 0, "Review the distinction before applying it.", "Best match: Returning to an earlier pattern of behavior during stress", "apply"], ["Redirecting emotion toward another target", 0, "Review the distinction before applying it.", "Best match: Returning to an earlier pattern of behavior during stress", "apply"], ["Attributing one's own unacceptable feelings to others", 0, "Review the distinction before applying it.", "Best match: Returning to an earlier pattern of behavior during stress", "apply"]]}, "apply": {"prompt": "A usually independent adult begins using childlike speech during a frightening visit. What is the best interpretation and response?", "choices": [["Possible regression; provide calm support while encouraging appropriate participation", 100, "Correct application.", "The childlike change under stress distinguishes regression. Offer support without labeling the patient, confronting the mechanism, or assuming incapacity.", null], ["Possible denial; repeat the facts until the patient accepts them", 0, "Review the best answer and its rationale.", "The childlike change under stress distinguishes regression. Offer support without labeling the patient, confronting the mechanism, or assuming incapacity.", null], ["Possible displacement; explain that the MA did not cause the fear", 0, "Review the best answer and its rationale.", "The childlike change under stress distinguishes regression. Offer support without labeling the patient, confronting the mechanism, or assuming incapacity.", null], ["Possible projection; ask why the patient thinks staff are acting childishly", 0, "Review the best answer and its rationale.", "The childlike change under stress distinguishes regression. Offer support without labeling the patient, confronting the mechanism, or assuming incapacity.", null]]}}}, {"title": "Internal noise", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Internal noise", "choices": [["Distraction arising within a person, such as worry or preoccupation", 100, "Correct match.", "Distraction arising within a person, such as worry or preoccupation", "apply"], ["Competing sounds in the surrounding room", 0, "Review the distinction before applying it.", "Best match: Distraction arising within a person, such as worry or preoccupation", "apply"], ["A difference between spoken words and facial expression", 0, "Review the distinction before applying it.", "Best match: Distraction arising within a person, such as worry or preoccupation", "apply"], ["An unfamiliar term in a written message", 0, "Review the distinction before applying it.", "Best match: Distraction arising within a person, such as worry or preoccupation", "apply"]]}, "apply": {"prompt": "A patient preoccupied with a recent loss cannot focus, even in a quiet room. Which response best addresses the evident barrier?", "choices": [["Acknowledge the concern, assess readiness, and adapt the conversation", 100, "Correct application.", "The barrier described is internal preoccupation. A different room or greater volume does not address it. Check readiness and adapt instead of assuming that more information will solve it.", null], ["Move to another room before exploring any concern", 0, "Review the best answer and its rationale.", "The barrier described is internal preoccupation. A different room or greater volume does not address it. Check readiness and adapt instead of assuming that more information will solve it.", null], ["Repeat the whole explanation at a louder volume", 0, "Review the best answer and its rationale.", "The barrier described is internal preoccupation. A different room or greater volume does not address it. Check readiness and adapt instead of assuming that more information will solve it.", null], ["Give a more detailed handout to replace the discussion", 0, "Review the best answer and its rationale.", "The barrier described is internal preoccupation. A different room or greater volume does not address it. Check readiness and adapt instead of assuming that more information will solve it.", null]]}}}, {"title": "Nonverbal incongruence", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Nonverbal incongruence", "choices": [["A mismatch between spoken words and observable body language", 100, "Correct match.", "A mismatch between spoken words and observable body language", "apply"], ["An environmental distraction that competes with a message", 0, "Review the distinction before applying it.", "Best match: A mismatch between spoken words and observable body language", "apply"], ["A check of what a receiver understood", 0, "Review the distinction before applying it.", "Best match: A mismatch between spoken words and observable body language", "apply"], ["A deliberate pause that allows a person to continue", 0, "Review the distinction before applying it.", "Best match: A mismatch between spoken words and observable body language", "apply"]]}, "apply": {"prompt": "An MA says, “Take your time,” while looking at the clock and turning toward the door. What is the best correction?", "choices": [["Pause other activity and make posture and attention consistent with the invitation", 100, "Correct application.", "Words and behavior send conflicting messages. Correct the MA's own behavior rather than asking the patient to ignore the mixed cue.", null], ["Repeat the same words with more detail while continuing toward the door", 0, "Review the best answer and its rationale.", "Words and behavior send conflicting messages. Correct the MA's own behavior rather than asking the patient to ignore the mixed cue.", null], ["Ask the patient to speak faster so the discussion can finish", 0, "Review the best answer and its rationale.", "Words and behavior send conflicting messages. Correct the MA's own behavior rather than asking the patient to ignore the mixed cue.", null], ["Explain the schedule before inviting the patient to continue", 0, "Review the best answer and its rationale.", "Words and behavior send conflicting messages. Correct the MA's own behavior rather than asking the patient to ignore the mixed cue.", null]]}}}, {"title": "Qualified interpreting", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Qualified interpreting", "choices": [["Using a person with the appropriate interpreting competence to support accurate two-way communication", 100, "Correct match.", "Using a person with the appropriate interpreting competence to support accurate two-way communication", "apply"], ["Relying on any fluent companion to summarize the visit", 0, "Review the distinction before applying it.", "Best match: Using a person with the appropriate interpreting competence to support accurate two-way communication", "apply"], ["Replacing discussion with a translated handout alone", 0, "Review the distinction before applying it.", "Best match: Using a person with the appropriate interpreting competence to support accurate two-way communication", "apply"], ["Directing conversation to a companion instead of the patient", 0, "Review the distinction before applying it.", "Best match: Using a person with the appropriate interpreting competence to support accurate two-way communication", "apply"]]}, "apply": {"prompt": "A patient prefers another language. An adult companion answers quickly, while the patient seems uncertain. What is the best plan?", "choices": [["Arrange a qualified interpreter and address the patient directly", 100, "Correct application.", "Support accurate communication with a qualified interpreter while keeping the patient central. A companion or handout may help in other ways but does not by itself resolve this need.", null], ["Have the companion summarize and confirm they know the terminology", 0, "Review the best answer and its rationale.", "Support accurate communication with a qualified interpreter while keeping the patient central. A companion or handout may help in other ways but does not by itself resolve this need.", null], ["Provide a translated handout and ask the companion to check understanding", 0, "Review the best answer and its rationale.", "Support accurate communication with a qualified interpreter while keeping the patient central. A companion or handout may help in other ways but does not by itself resolve this need.", null], ["Ask closed questions in English to reduce the need for interpretation", 0, "Review the best answer and its rationale.", "Support accurate communication with a qualified interpreter while keeping the patient central. A companion or handout may help in other ways but does not by itself resolve this need.", null]]}}}, {"title": "Teach-back", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Teach-back", "choices": [["Inviting a patient to explain information in their own words to check the clarity of teaching", 100, "Correct match.", "Inviting a patient to explain information in their own words to check the clarity of teaching", "apply"], ["Asking whether a patient understands", 0, "Review the distinction before applying it.", "Best match: Inviting a patient to explain information in their own words to check the clarity of teaching", "apply"], ["Having a patient repeat the exact wording used", 0, "Review the distinction before applying it.", "Best match: Inviting a patient to explain information in their own words to check the clarity of teaching", "apply"], ["Giving a patient an additional written summary", 0, "Review the distinction before applying it.", "Best match: Inviting a patient to explain information in their own words to check the clarity of teaching", "apply"]]}, "apply": {"prompt": "During teach-back, a patient explains one step incorrectly. What should the MA do next?", "choices": [["Explain that part differently and invite another teach-back", 100, "Correct application.", "Use the misunderstanding as feedback about the explanation. Adapt and check again. Repetition, signatures, or additional text do not establish usable understanding.", null], ["Ask the patient to repeat the original sentence exactly", 0, "Review the best answer and its rationale.", "Use the misunderstanding as feedback about the explanation. Adapt and check again. Repetition, signatures, or additional text do not establish usable understanding.", null], ["Document that the instructions were given and obtain a signature", 0, "Review the best answer and its rationale.", "Use the misunderstanding as feedback about the explanation. Adapt and check again. Repetition, signatures, or additional text do not establish usable understanding.", null], ["Add a longer handout and ask the patient to review it later", 0, "Review the best answer and its rationale.", "Use the misunderstanding as feedback about the explanation. Adapt and check again. Repetition, signatures, or additional text do not establish usable understanding.", null]]}}}, {"title": "De-escalation", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: De-escalation", "choices": [["Using calm acknowledgment and respectful communication to reduce tension", 100, "Correct match.", "Using calm acknowledgment and respectful communication to reduce tension", "apply"], ["Correcting a service failure and checking the resolution", 0, "Review the distinction before applying it.", "Best match: Using calm acknowledgment and respectful communication to reduce tension", "apply"], ["Giving advice before exploring an emotion", 0, "Review the distinction before applying it.", "Best match: Using calm acknowledgment and respectful communication to reduce tension", "apply"], ["Explaining why the practice's actions were reasonable", 0, "Review the distinction before applying it.", "Best match: Using calm acknowledgment and respectful communication to reduce tension", "apply"]]}, "apply": {"prompt": "A patient complains loudly about a delay but makes no threats. Which action is best first?", "choices": [["Calmly acknowledge the frustration and offer an appropriate private conversation", 100, "Correct application.", "With no threat described, begin with a calm acknowledgment and appropriate privacy. Explanations and solutions are more useful after the concern is heard.", null], ["Explain the reasons for the delay before asking about the concern", 0, "Review the best answer and its rationale.", "With no threat described, begin with a calm acknowledgment and appropriate privacy. Explanations and solutions are more useful after the concern is heard.", null], ["Offer a new appointment before learning what the patient needs", 0, "Review the best answer and its rationale.", "With no threat described, begin with a calm acknowledgment and appropriate privacy. Explanations and solutions are more useful after the concern is heard.", null], ["Ask the patient to lower their voice before offering assistance", 0, "Review the best answer and its rationale.", "With no threat described, begin with a calm acknowledgment and appropriate privacy. Explanations and solutions are more useful after the concern is heard.", null]]}}}, {"title": "Service recovery", "intro": "Match the term to its meaning. Choose one definition.", "nodes": {"start": {"prompt": "Match: Service recovery", "choices": [["Acknowledging a service problem, correcting what can be corrected, and following up", 100, "Correct match.", "Acknowledging a service problem, correcting what can be corrected, and following up", "apply"], ["Reducing immediate tension before discussing a complaint", 0, "Review the distinction before applying it.", "Best match: Acknowledging a service problem, correcting what can be corrected, and following up", "apply"], ["Explaining why a negative outcome could not be avoided", 0, "Review the distinction before applying it.", "Best match: Acknowledging a service problem, correcting what can be corrected, and following up", "apply"], ["Promising that a service problem will never recur", 0, "Review the distinction before applying it.", "Best match: Acknowledging a service problem, correcting what can be corrected, and following up", "apply"]]}, "apply": {"prompt": "The office gave conflicting arrival times. The MA apologizes and arranges a feasible replacement visit. What best completes service recovery?", "choices": [["Confirm the new details meet the patient's needs and follow up as appropriate", 100, "Correct application.", "A correction should be checked for understanding and usefulness. Follow-through completes recovery; blame and guarantees do not.", null], ["Explain which staff member supplied the wrong information", 0, "Review the best answer and its rationale.", "A correction should be checked for understanding and usefulness. Follow-through completes recovery; blame and guarantees do not.", null], ["Promise that every future visit will begin on time", 0, "Review the best answer and its rationale.", "A correction should be checked for understanding and usefulness. Follow-through completes recovery; blame and guarantees do not.", null], ["Close the discussion because an appointment has been booked", 0, "Review the best answer and its rationale.", "A correction should be checked for understanding and usefulness. Follow-through completes recovery; blame and guarantees do not.", null]]}}}];
const $=id=>document.getElementById(id);
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let peer,connection,role='',phase='home',room='',limit=30,players=new Map(),self=null,latest=[],clock,waiting,peerReady=false;
const MAX=CASES.length*2;
function notice(s){$('notice').textContent=s}
function renderJoinQr(){const box=document.getElementById('joinQr');if(!box)return;try{if(typeof QRCode==='undefined')throw Error('QR unavailable');new QRCode(box,{text:box.dataset.joinUrl,width:220,height:220,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});box.removeAttribute('title')}catch(e){box.textContent='Open the game in Canvas → Module 2, then enter the code.'}}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function progress(p){return p.history.length}
function rows(){const list=[...players.values()].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));return list.map((p,i)=>({name:p.name,score:p.score,progress:progress(p),finished:p.finished,online:!!p.conn?.open,rank:1+list.filter(x=>x.score>p.score).length}))}
function board(list){return '<table><caption>Live leaderboard</caption><thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Points</th><th scope="col">Progress</th></tr></thead><tbody>'+list.map(p=>'<tr><td>'+p.rank+'</td><td>'+esc(p.name)+(p.online===false?' · offline':'')+'</td><td>'+p.score+'</td><td>'+p.progress+'/'+MAX+(p.finished?' ✓':'')+'</td></tr>').join('')+'</tbody></table>'}
function home(){phase='home';show('<div class="grid"><section class="card"><h2>Join your class</h2><p>Live pre-KC review: enter the six-character code your instructor provides in class and a display name.</p><form id="joinForm"><label>Game code<input id="code" required maxlength="6" value="'+esc(new URLSearchParams(location.search).get('room')||'')+'" autocomplete="off"></label><label>Display name<input id="name" required maxlength="24" autocomplete="nickname"></label><button>Join review game</button></form></section><section class="card instructor-only"><h2>Instructor launch</h2><p>Plan 15–30 minutes: twelve concepts and 24 tasks. At 30 seconds per task, answering takes up to 12 minutes; use the remaining time for explanations and discussion. Students advance independently after you start.</p><label>Time per decision<select id="limit"><option selected>30</option><option>45</option><option>60</option><option>90</option></select></label><button id="host">Host live game</button> <button id="solo" class="secondary">Try solo</button><details><summary>How to run the game</summary><ol><li>Host a game and share the join link or code.</li><li>Wait for students, then select Start game.</li><li>Students match a meaning, apply the concept, and review an explanation after each response.</li><li>Discuss missed concepts and download results before closing.</li></ol><p>Each correct response earns 100 points. There is no speed bonus. Tied scores share a rank. A timeout earns zero. Reading feedback is untimed.</p><p class="muted small">Live play needs internet and browser-to-browser connections. Test on classroom Wi-Fi. Reloading loses the session; save the results before closing. This uses display names rather than authenticated accounts and does not send grades to Canvas.</p><p class="small">Topic reference: <a href="https://www.aama-ntl.org/docs/default-source/about-profession-and-credential/cma-exam/exam-content-outline-effective.pdf" target="_blank" rel="noopener">AAMA exam outline · Communication</a>. Independent practice; not a prediction of exam questions.</p></details></section></div><section class="card"><h2>Your review concepts</h2><div class="grid">'+CASES.map((c,i)=>'<div><span class="pill">Concept '+(i+1)+'</span><h3>'+esc(c.title)+'</h3></div>').join('')+'</div><p>Each concept has two scored tasks: match the definition, then apply it. Choices shuffle every time. Your final review separates missed meanings from missed applications.</p></section>');$('joinForm').onsubmit=e=>{e.preventDefault();join()};$('host').onclick=host;$('solo').onclick=solo}
function newPlayer(name,conn){return {name,conn,caseIndex:0,step:0,node:'start',score:0,finished:false,answering:false,review:false,history:[],lastReaction:'',deadline:0,order:[]}}
function makeDecision(p){if(p.caseIndex>=CASES.length){p.finished=true;return null}const c=CASES[p.caseIndex],node=c.nodes[p.node];p.order=shuffle(node.choices.map((_,i)=>i));p.answering=true;p.review=false;p.deadline=Date.now()+limit*1000;return {type:'decision',caseTitle:p.step===0?c.title:'Apply the concept',intro:p.step===0?c.intro:'Use what you know to choose the best answer. Read all four choices.',caseIndex:p.caseIndex,step:p.step,node:p.node,prompt:node.prompt,choices:p.order.map(i=>node.choices[i][0]),seconds:limit,score:p.score,lastReaction:p.lastReaction}}
function send(p,msg){if(role==='solo')handle(msg);else if(p.conn?.open)p.conn.send(msg)}
function deliver(p){clearTimeout(p.timeout);const data=makeDecision(p);if(!data){send(p,{type:'done',score:p.score,history:p.history,rows:role==='solo'?[]:rows()});if(role==='host'){update();checkComplete()}return}send(p,data);if(role==='host')p.timeout=setTimeout(()=>submit(p,{node:p.node,caseIndex:p.caseIndex,choice:-1}),limit*1000)}
function submit(p,d){if(!p.answering||p.finished||d.node!==p.node||d.caseIndex!==p.caseIndex||!Number.isInteger(d.choice)||d.choice< -1||d.choice>3)return;p.answering=false;clearTimeout(p.timeout);const c=CASES[p.caseIndex],n=c.nodes[p.node],timed=d.choice===-1||Date.now()>p.deadline,original=timed?-1:p.order[d.choice],choice=original<0?null:n.choices[original];const best=n.choices.find(x=>x[1]===100),points=choice?choice[1]:0;p.score+=points;const reaction=choice?choice[2]:'Time expired. Read the explanation, then continue.';const feedback=choice?choice[3]:'No answer was received within the time limit. Review the best answer and continue. A missed match does not prevent you from answering the application question.';p.next=choice?choice[4]:(p.step===0?'apply':null);p.lastReaction=reaction;p.review=true;p.history.push({caseTitle:c.title,prompt:n.prompt,selected:choice?choice[0]:'Time expired',points,reaction,feedback,best:best[0]});send(p,{type:'feedback',points,score:p.score,reaction,feedback,best:best[0],caseEnd:p.next===null,finishedCount:p.caseIndex*2+p.step+1});if(role==='host')update()}
function advance(p){if(!p.review||p.finished)return;p.review=false;if(p.next===null){p.caseIndex++;p.step=0;p.node='start';p.lastReaction=''}else{p.node=p.next;p.step++}deliver(p);if(role==='host')update()}
function solo(){notice('This game is available only during a live class review.');return;limit=Number($('limit').value);role='solo';phase='playing';notice('Solo practice · scores are only on this device.');self=newPlayer('You',null);deliver(self)}
function setupPeer(id){if(!window.Peer){notice('The connection service did not load. Try solo or check your internet connection.');return false}if(peer)peer.destroy();peerReady=false;peer=id?new Peer(id):new Peer();peer.on('error',e=>{notice('Live connection issue ('+e.type+'). Check the code and network. If needed, open a fresh game.');if($('joinButton'))$('joinButton').disabled=false});peer.on('disconnected',()=>notice('Live connection interrupted. Keep this page open and check the network.'));return true}
function host(){if(!instructorAccess){notice('Open the instructor launch link in Canvas to host.');return}limit=Number($('limit').value);role='host';phase='opening';room=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x%32]).join('');if(!setupPeer('ivy-match-'+room))return;show('<section class="card"><h2>Opening your game…</h2><p>Connecting to the classroom service.</p></section>');peer.on('open',()=>{peerReady=true;phase='lobby';notice('Room ready. Invite your students.');hostView()});peer.on('connection',conn=>{conn.on('data',d=>receive(conn,d));conn.on('close',()=>{const p=players.get(conn.peer);if(p){p.conn=null;update()}})})}
function receive(conn,d){if(!d||typeof d!=='object')return;if(d.type==='join'){if(phase!=='lobby'){conn.send({type:'error',text:'This game has already started. Join the next round.'});return}if(players.has(conn.peer))return;const name=String(d.name||'').trim().slice(0,24);if(!name||[...players.values()].some(p=>p.name.toLowerCase()===name.toLowerCase())){conn.send({type:'error',text:'Choose a display name that is not already in this room.'});return}if(players.size>=60){conn.send({type:'error',text:'This room has reached its 60-player limit.'});return}const p=newPlayer(name,conn);players.set(conn.peer,p);conn.send({type:'welcome'});update();return}if(phase!=='playing')return;const p=players.get(conn.peer);if(!p)return;if(d.type==='answer')submit(p,d);if(d.type==='next')advance(p)}
function update(){const list=rows();for(const p of players.values())if(p.conn?.open)p.conn.send({type:'board',rows:list});if(role==='host')hostView()}
function checkComplete(){if(phase==='playing'&&[...players.values()].every(p=>p.finished))endRace()}
function hostView(){const list=rows(),joinUrl=location.origin+location.pathname+'?room='+room;show('<section class="card"><span class="pill">Instructor console</span><h2>'+(phase==='lobby'?'Ready for your class':phase==='finished'?'Game results':'Review in progress')+'</h2><div class="code">'+room+'</div><div class="join-panel"><div><h3>Scan to join</h3><div id="joinQr" class="join-qr" role="img" aria-label="QR code to join this game" data-join-url="'+esc(location.origin+location.pathname+'?room='+room)+'"></div></div><div class="join-steps"><h3>Or open this game in Canvas</h3><p>Module 2 → select this game</p><p>Enter the <strong>six-character code above</strong> and your display name.</p><a class="button" target="_blank" rel="noopener" href="'+esc(location.origin+location.pathname+'?room='+room)+'">Open student join page</a></div></div><p>'+players.size+' players · '+[...players.values()].filter(p=>p.conn?.open).length+' connected · '+limit+' seconds per decision</p><div id="controls"></div></section><section class="card">'+board(list)+'</section><section class="card"><h2>Debrief prompts</h2><p>Which terms were easy to confuse? What detail distinguished the best answer? Can students apply the concept to a different example?</p><p class="muted">Students are ranked by points, not finishing speed. Keep this tab open; download results before you leave.</p></section>');if(phase==='lobby'){$('controls').innerHTML='<button id="start" '+(!list.some(p=>p.online)?'disabled':'')+'>Start game</button>';$('start').onclick=()=>{for(const [id,p] of players)if(!p.conn?.open)players.delete(id);phase='playing';notice('Game started. Students advance independently.');for(const p of players.values())deliver(p);update()}}else if(phase==='playing'){$('controls').innerHTML='<button id="end" class="secondary">End game and show results</button>';$('end').onclick=endRace}else{$('controls').innerHTML='<button id="results">Download results</button> <button id="new" class="secondary">New game</button>';$('results').onclick=exportResults;$('new').onclick=()=>{peer.destroy();players.clear();role='';notice('');home()}}}
function endRace(){phase='finished';notice('Game ended. Download results before closing.');for(const p of players.values()){clearTimeout(p.timeout);p.answering=false;p.review=false;send(p,{type:'done',score:p.score,history:p.history,rows:rows()})}update()}
function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportResults(){const cell=x=>'"'+(' '+String(x)).replace(/"/g,'""')+'"';const csv=[['Rank','Display name','Points','Decisions answered','Finished'].join(',')];for(const r of rows()){const p=[...players.values()].find(p=>p.name===r.name);csv.push([r.rank,cell(r.name),r.score,p.history.length,p.finished?'Yes':'No'].join(','))}download('match-apply-results.csv',csv.join('\r\n'),'text/csv')}
function join(){const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim();if(!/^[A-Z2-9]{6}$/.test(code)||!name){notice('Enter a six-character room code and a display name.');return}role='student';phase='joining';if(!setupPeer())return;notice('Connecting to your instructor…');clearTimeout(waiting);waiting=setTimeout(()=>{if(phase==='joining')notice('Still connecting. Check the code and ask your instructor to keep the room open. Your network may block live connections.')},15000);peer.on('open',()=>{connection=peer.connect('ivy-match-'+code,{reliable:true});connection.on('open',()=>connection.send({type:'join',name}));connection.on('data',handle);connection.on('close',()=>{clearInterval(clock);notice('The instructor connection closed. Ask the instructor about starting a new round.');document.querySelectorAll('.choices button').forEach(b=>b.disabled=true);if($('next'))$('next').disabled=true})})}
let active=null,submitted=false;
function handle(d){if(!d||typeof d!=='object')return;if(d.type==='error'){clearTimeout(waiting);phase='home';notice(d.text);return}if(d.type==='welcome'){clearTimeout(waiting);phase='lobby';notice('');show('<section class="card"><h2>You’re in!</h2><p>Wait for your instructor to start the game. Each concept has a meaning match and a separate scenario question. Answers shuffle, so read every choice.</p></section><section id="leader" class="card"></section>')}if(d.type==='board'){latest=d.rows;if($('leader'))$('leader').innerHTML=board(latest)}if(d.type==='decision'){phase='playing';decision(d)}if(d.type==='feedback')feedback(d);if(d.type==='done')done(d)}
function decision(d){clearInterval(clock);active=d;submitted=false;const began=Date.now();show('<section class="card"><span class="pill">Concept '+(d.caseIndex+1)+' of '+CASES.length+'</span><span class="pill">'+(d.step===0?'Match the meaning':'Apply it')+'</span><span id="clock" class="timer">'+d.seconds+'s</span><div class="progress"><div id="bar" style="width:100%"></div></div><h2>'+esc(d.caseTitle)+'</h2><p class="patient">'+esc(d.intro)+'</p><h3>'+esc(d.prompt)+'</h3><div class="choices">'+d.choices.map((c,i)=>'<button data-answer="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(c)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div><p class="muted">Current score at start of decision: '+d.score+' · No speed bonus—use the time to think.</p></section><section id="leader" class="card">'+(role==='solo'?'Solo practice · each response can earn up to 100 points.':board(latest))+'</section>');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));clock=setInterval(()=>{const left=Math.max(0,d.seconds-(Date.now()-began)/1000);$('clock').textContent=Math.ceil(left)+'s';$('bar').style.width=100*left/d.seconds+'%';if(left<=0)answer(-1)},100)}
function answer(choice){if(submitted||!active||phase!=='playing')return;submitted=true;clearInterval(clock);document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);const d={type:'answer',node:active.node,caseIndex:active.caseIndex,choice};if(role==='solo')submit(self,d);else if(connection?.open){$('feedback').textContent='Response sent…';connection.send(d)}else notice('Connection lost. Please let your instructor know.')}
function feedback(d){clearInterval(clock);submitted=true;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);if(!$('feedback'))return;$('feedback').innerHTML='<div class="reaction"><span class="pill">+'+d.points+' points</span><h3>Your result</h3><p>'+esc(d.reaction)+'</p><h3>Why this matters</h3><p>'+esc(d.feedback)+'</p>'+(d.points<100?'<p><strong>Best response:</strong> '+esc(d.best)+'</p>':'')+'<p>Total: '+d.score+' points · '+d.finishedCount+'/'+MAX+' decisions</p><button id="next">'+(d.caseEnd?(d.finishedCount>=MAX?'See results':'Next concept'):'Apply this concept')+'</button></div>';$('next').onclick=()=>{$('next').disabled=true;if(role==='solo')advance(self);else if(connection?.open)connection.send({type:'next'})}}
function conceptReview(history){return '<h2>What to review next</h2><table><caption>Your concept results</caption><thead><tr><th scope="col">Concept</th><th scope="col">Meaning</th><th scope="col">Application</th><th scope="col">Next step</th></tr></thead><tbody>'+CASES.map(c=>{const h=history.filter(x=>x.caseTitle===c.title),m=h[0],a=h[1];return '<tr><th scope="row">'+esc(c.title)+'</th><td>'+(!m?'Not reached':m.points===100?'Correct':'Review')+'</td><td>'+(!a?'Not reached':a.points===100?'Correct':'Review')+'</td><td>'+(!m||!a?'Finish this concept':m.points===100&&a.points===100?'Practice a new example':m.points!==100&&a.points!==100?'Review meaning and application':m.points!==100?'Review the meaning':'Practice applying the term')+'</td></tr>'}).join('')+'</tbody></table>'}
function done(d){clearInterval(clock);active=null;phase='finished';show('<section class="card"><h2>Your concept review</h2><p class="timer">'+d.score+' / '+(MAX*100)+'</p><p>'+d.history.length+' of '+MAX+' decisions completed. Use the table below to identify which meanings and applications need another look.</p><button id="reviewSave" class="secondary">Download my review</button>'+(role==='solo'?' <button id="back">Back to launch</button>':'<p>You may finish before classmates; live rankings continue to update.</p>')+'</section><section class="card">'+conceptReview(d.history)+'</section><section class="card"><h2>Revisit your decisions</h2>'+d.history.map((h,i)=>'<details><summary>'+ (i+1)+'. '+esc(h.caseTitle)+' · '+h.points+' points</summary><p><strong>Decision:</strong> '+esc(h.prompt)+'</p><p><strong>Your response:</strong> '+esc(h.selected)+'</p><p><strong>Result:</strong> '+esc(h.reaction)+'</p><p>'+esc(h.feedback)+'</p><p><strong>Best response:</strong> '+esc(h.best)+'</p></details>').join('')+'</section>'+(role==='solo'?'':'<section id="leader" class="card">'+board(d.rows||latest)+'</section>'));$('reviewSave').onclick=()=>download('my-match-apply-review.txt',d.history.map((h,i)=>(i+1)+'. '+h.caseTitle+'\n'+h.prompt+'\nYour response: '+h.selected+'\nResult: '+h.reaction+'\n'+h.feedback+'\nBest response: '+h.best+'\nPoints: '+h.points).join('\n\n'),'text/plain');if($('back'))$('back').onclick=()=>{role='';notice('');home()}}
window.addEventListener('beforeunload',e=>{if(peer&&phase!=='home'){e.preventDefault();e.returnValue=''}});
home();unlockInstructor();
</script></body></html>
