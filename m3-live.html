function editor(){view('<section class="card"><h2>Create a question set</h2><p>Enter a title and edit the example below. Each question needs four choices, a correct answer number from 1–4, and feedback. Save the JSON file to reuse on another computer.</p><label>Title<input id="title" value="My classroom challenge"></label><label>Questions (JSON)<textarea id="json"></textarea></label><button id="use">Use question set</button> <button class="secondary" id="download">Download set</button><label style="margin-top:20px">Load a saved question set<input id="file" type="file" accept=".json,application/json"></label><button class="secondary" id="back">Back</button></section>');$('json').value=JSON.stringify([{question:'Which prefix means slow?',choices:['brady-','tachy-','hyper-','peri-'],answer:1,feedback:'Brady- means slow.'}],null,2);function read(){let q=JSON.parse($('json').value);if(!Array.isArray(q)||!q.length||q.length>100)throw Error('Use 1–100 questions.');q.forEach(x=>{if(typeof x.question!=='string'||!x.question.trim()||!Array.isArray(x.choices)||x.choices.length!==4||x.choices.some(c=>typeof c!=='string'||!c.trim())||!Number.isInteger(x.answer)||x.answer<1||x.answer>4||typeof x.feedback!=='string')throw Error('Check the question format, four choices, answer (1–4), and feedback.');});return {title:$('title').value.trim().slice(0,100)||'My challenge',questions:q}}

function shuffleDeckAnswers(source){
  return {...source,questions:source.questions.map(([prompt,choices,correct,feedback])=>{
    const order=choices.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    return [prompt,order.map(i=>choices[i]),order.indexOf(correct),feedback];
  })};
}

function receive(c,d){if(!d||typeof d!=='object')return;if(d.type==='join'){if(phase!=='lobby'){c.send({type:'error',message:'This game has started. Join the next round.'});return}if(players.has(c.peer))return;const name=String(d.name||'').trim().slice(0,24);if(!name)return;if([...players.values()].some(p=>p.name.toLowerCase()===name.toLowerCase())){c.send({type:'error',message:'That display name is taken. Add an initial or number.'});return}if(players.size>=60){c.send({type:'error',message:'This room is full.'});return}players.set(c.peer,{c,name,score:0,i:0,answered:false});c.send({type:'welcome',title:deck.title});broadcast()}const p=players.get(c.peer);if(!p||phase!=='playing')return;if(d.type==='answer')grade(p,d);if(d.type==='next'&&mode==='race'&&p.answered){p.i++;sendQuestion(p);broadcast();if([...players.values()].every(x=>x.i>=deck.questions.length))finish()}}

function grade(p,d){if(p.answered||d.i!==p.i||!Number.isInteger(d.choice)||d.choice< -1||d.choice>3)return;p.answered=true;const q=deck.questions[p.i],elapsed=Date.now()-p.sent,correct=d.choice===q[2]&&elapsed<=seconds*1000;const points=correct?100+Math.max(0,Math.round(50*(1-elapsed/(seconds*1000)))):0;p.score+=points;p.result={type:'result',correct,answer:q[1][q[2]],feedback:q[3],points,score:p.score,mode};p.c?.send(p.result);broadcast()}
function schedulePaced(){clearTimeout(timer);timer=setTimeout(()=>{for(const p of players.values())if(!p.answered)grade(p,{i:p.i,choice:-1});hostView()},seconds*1000)}
function nextPaced(){index++;if(index>=deck.questions.length){finish();return}for(const p of players.values()){p.i=index;sendQuestion(p)}hostView();schedulePaced()}
function finish(){phase='finished';note('Game ended. Download results before closing this tab.');clearTimeout(timer);for(const p of players.values())p.c?.send({type:'done',score:p.score,rows:ranks()});hostView()}
function join(){if(!window.Peer){note('Live connections are unavailable. Please try again later.');return}const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim();if(!/^[A-Z2-9]{6}$/.test(code)||!name){note('Enter a six-character code and a display name.');return}host=false;local=false;phase='joining';if(peer)peer.destroy();peer=new Peer();note('Connecting to your instructor…');peer.on('open',()=>{link=peer.connect('ivy-cma-'+code,{reliable:true});link.on('open',()=>link.send({type:'join',name}));link.on('data',studentReceive);link.on('close',()=>{clearInterval(timer);note('Disconnected from the instructor. Ask the instructor to start a new round.');document.querySelectorAll('.answers button').forEach(b=>b.disabled=true)})});peer.on('error',()=>note('Could not connect. Check the code and ask your instructor to keep the game open. Your network may block live connections.'));}
let latestRows=[];
function studentReceive(d){if(d.type==='error'){note(d.message);return}if(d.type==='welcome'){note('');phase='lobby';view('<section class="card"><h2>You’re in!</h2><p>'+esc(d.title)+'</p><p>Waiting for your instructor to start…</p></section><section id="leader" class="card"></section>')}if(d.type==='board'){latestRows=d.rows;if($('leader'))$('leader').innerHTML=board(d.rows)}if(d.type==='question'){phase='playing';index=d.i;seconds=d.seconds;mode=d.mode;question([d.q,d.choices],d.i,d.total)}if(d.type==='result')result(d);if(d.type==='done'){clearInterval(timer);phase='finished';view('<section class="card"><h2>Challenge complete!</h2><p class="timer">'+d.score+' points</p><p>Well done—review the feedback and keep practicing.</p></section><section id="leader" class="card">'+board(d.rows)+'</section>')}}
function question(q,i,total=deck?.questions.length){clearInterval(timer);answered=false;const stamp=++session;startAt=Date.now();view('<section class="card"><span class="pill">Question '+(i+1)+' of '+total+'</span><span id="clock" class="timer">'+seconds+'</span><div class="progress"><div id="bar" style="width:100%"></div></div><h2>'+esc(q[0])+'</h2><div class="answers">'+q[1].map((c,j)=>'<button data-choice="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(c)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section><section id="leader" class="card">'+(latestRows.length?board(latestRows):'Your score will appear after your answer.')+'</section>');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)));timer=setInterval(()=>{if(stamp!==session)return;const remaining=Math.max(0,seconds-(Date.now()-startAt)/1000);$('clock').textContent=Math.ceil(remaining);$('bar').style.width=(remaining/seconds*100)+'%';if(remaining<=0)answer(-1)},100)}
function answer(choice){if(answered||phase!=='playing')return;answered=true;clearInterval(timer);document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);if(local){const q=deck.questions[index],elapsed=Date.now()-startAt,correct=choice===q[2]&&elapsed<=seconds*1000,points=correct?100+Math.max(0,Math.round(50*(1-elapsed/(seconds*1000)))):0;ownScore+=points;result({correct,answer:q[1][q[2]],feedback:q[3],points,score:ownScore,mode:'race'})}else if(link?.open){$('feedback').textContent='Answer sent…';link.send({type:'answer',choice,i:index})}}
function result(d){clearInterval(timer);answered=true;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);if(!$('feedback'))return;$('feedback').innerHTML='<h3>'+(d.correct?'Correct! +'+d.points:'Keep learning')+'</h3><p><strong>Answer: '+esc(d.answer)+'</strong></p><p>'+esc(d.feedback)+'</p><p>Total: '+d.score+' points</p>'+(d.mode==='race'?'<button id="continue">Continue</button>':'<p>Wait for your instructor to advance.</p>');if($('continue'))$('continue').onclick=()=>{if(local){index++;if(index<deck.questions.length)question(deck.questions[index],index);else{phase='finished';view('<section class="card"><h2>Practice complete!</h2><p class="timer">'+ownScore+' points</p><button id="home">Back to games</button></section>');$('home').onclick=home}}else{ $('continue').disabled=true;link.send({type:'next'})}}}
window.addEventListener('beforeunload',e=>{if(peer&&phase!=='home'){e.preventDefault();e.returnValue=''}});home();unlockInstructor();
</script></html>
