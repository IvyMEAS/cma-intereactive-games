<style>
:root{font-family:system-ui,sans-serif;color:#173c32;background:#eef3ef}*{box-sizing:border-box}body{margin:0}header{background:#064e3b;color:white;padding:24px max(6vw,20px);border-bottom:6px solid #e5b94d}header small{letter-spacing:.15em;color:#ffe09b}h1{font-size:clamp(26px,4vw,44px);margin:8px 0}main{max-width:1080px;margin:auto;padding:30px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}.card{background:white;padding:26px;border-radius:18px;box-shadow:0 5px 24px #163c3210;margin-bottom:20px}button,.button{background:#066747;color:white;border:0;border-radius:10px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;display:inline-block}button.secondary{background:#e5b94d;color:#233b30}button:disabled{opacity:.5;cursor:default}input,select,textarea{font:inherit;border:1px solid #80968c;border-radius:8px;padding:12px;width:100%;margin:7px 0 17px}label{display:block;font-weight:650}p{line-height:1.6}.muted{color:#52685e}.code{font-size:48px;font-weight:850;letter-spacing:.16em}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px;border-bottom:1px solid #dce6df}h2{margin-top:0}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.answers button{text-align:left;min-height:75px}.answers button:nth-child(2){background:#314e95}.answers button:nth-child(3){background:#893c64}.answers button:nth-child(4){background:#865210}#notice{max-width:1040px;margin:15px auto;padding:14px 20px;background:#fff1c9;border-radius:9px}#notice:empty{display:none}.pill{background:#e1efe7;display:inline-block;padding:7px 12px;border-radius:30px;margin:0 7px 12px 0}.timer{font-size:32px;font-weight:800}a{color:#006747}button:focus-visible,a:focus-visible{outline:4px solid #b77300;outline-offset:3px}textarea{min-height:260px}.progress{height:12px;background:#dbe8df;border-radius:8px;overflow:hidden;margin:20px 0}.progress div{height:100%;background:#c49824}footer{padding:20px;text-a .join-panel{display:flex;flex-wrap:wrap;align-items:center;gap:30px;margin:22px 0}.join-panel h3{margin:0 0 12px}.join-qr{background:white;padding:20px;width:260px;height:260px}.join-steps{max-width:480px;font-size:20px}.join-steps p{margin:12px 0}.join-panel .button{font-size:16px}.join-qr img,.join-qr canvas{display:block}</style><header><small>MEAS109 · INTERPERSONAL COMMUNICATION</small><h1>M2 CH4 · Communication Clinic</h1><div>25 office scenarios. Choose the best response. Build communication confidence.</div></header><div id="notice" role="status" aria-live="polite"></div><main id="app"></main><footer>Classroom practice · Display names only · Keep the instructor tab open during live play</footer>

const decks=[{"title": "M2 CH4 · Communication Clinic", "questions": [["After explaining a preparation, the MA asks, “Any questions?” The patient says no but cannot describe the first step. What should the MA do next?", ["Repeat the complete explanation before checking again", "Ask which step is unclear, reteach that part, and check teach-back", "Ask the patient to reread the handout at home", "Ask the companion to confirm that instructions were given"], 1, "Use the patient's feedback to locate the gap, reteach in manageable parts, and check again. Providing information or asking for questions alone does not establish understanding."], ["A patient repeatedly looks toward a noisy hallway during instructions. Which action best addresses the most evident barrier first?", ["Ask about worries that may interfere with learning", "Offer a larger-print version of the instructions", "Reduce the noise or move to a quieter area", "Ask the patient to demonstrate the entire process"], 2, "The scenario supplies an observable environmental distraction. Address it before deciding whether additional teaching or another accommodation is needed."], ["An MA says, “I want to hear your concerns,” while typing and facing away. The patient gives brief answers. What is the best initial adjustment?", ["Pause typing, turn toward the patient, and invite them to continue", "Summarize the brief answers and finish documenting", "Ask additional closed questions to gather the missing details", "Explain that documentation is necessary during every visit"], 0, "Align attention and posture with the verbal invitation. More questions may not help until the MA removes the mixed message."], ["A patient avoids eye contact and holds their arms tightly. Which statement best checks the meaning without assuming it?", ["“You seem reluctant to cooperate with the visit.”", "“People often sit that way when they are angry.”", "“You look anxious; I will ask the provider to explain.”", "“How are you feeling about what we have discussed?”"], 3, "An open, neutral question lets the patient explain. Posture and eye contact are cues to explore, not reliable proof of a particular emotion."], ["During education, a patient says, “I cannot think about this while I have nothing to eat tonight.” Which response best applies Maslow?", ["Explain how learning the plan will improve long-term independence", "Acknowledge the food concern and help connect the patient with appropriate resources", "Invite the patient to describe how the situation affects self-esteem", "Finish teaching now and offer resource information at the end"], 1, "An immediate physiological need can interfere with attention. Recognize that priority and help within the MA's role rather than continuing as if the barrier were resolved."], ["A bereaved patient says, “Yesterday I felt accepting; today I am angry again.” Which response is best?", ["“What concerns do you think are keeping you from acceptance?”", "“You may need to complete the anger stage before moving forward.”", "“Feelings can change; tell me what today has been like.”", "“Would focusing on yesterday help you avoid today's anger?”"], 2, "Grief responses do not have to occur in a fixed order. Invite the patient's experience without treating changing feelings as failure or prescribing a sequence."], ["After learning upsetting news about a family member, a patient criticizes the MA about a minor paperwork delay. What is the best interpretation and response?", ["Possible displacement; acknowledge the distress and address the immediate concern calmly", "Possible projection; ask the patient to identify whom they are really blaming", "Possible denial; repeat the family news until the patient accepts it", "Possible rationalization; explain why the paperwork delay is unavoidable"], 0, "The emotion appears redirected from a distressing event to the MA. Recognizing possible displacement supports a calm response without diagnosing or confronting the patient."], ["A normally independent adult begins speaking childishly and asks staff to complete familiar tasks during a stressful visit. Which interpretation best fits?", ["Denial, because the patient is refusing to recognize the visit", "Projection, because responsibility is being assigned to staff", "Rationalization, because the patient is explaining away behavior", "Regression, because stress is associated with an earlier behavior pattern"], 3, "Regression describes a return to earlier patterns under stress. Asking for help alone is not enough; the childlike change in behavior is the distinguishing detail."], ["A patient says, “The provider says this condition is present, but those findings cannot apply to me.” Which response is most helpful?", ["“The findings are accurate, so we need you to accept them.”", "“What is hardest for you to take in about what you were told?”", "“Let us postpone discussing this until you feel ready to agree.”", "“Many patients react this way before they accept a diagnosis.”"], 1, "Explore the difficulty accepting the information without arguing, labeling, or withdrawing support. Route clinical questions to the provider."], ["A patient says, “I am frightened they will find something serious.” Which reply best supports exploration before reassurance?", ["“The provider has helped many people with the same worry.”", "“Would you like me to explain the steps of the visit first?”", "“What possibility is worrying you most right now?”", "“It may help to focus on what we already know.”"], 2, "The patient's specific fear has not yet been explored. A focused invitation to describe it is the best next response; information can follow once the concern is understood."], ["A patient pauses after saying, “There is something else I should mention…” What should the MA do first?", ["Remain attentive and allow a brief silence", "Offer examples of sensitive concerns patients commonly have", "Ask a specific question to make disclosure easier", "Summarize the visit and invite a message through the portal"], 0, "The patient appears ready to continue. Brief attentive silence leaves room for disclosure without steering the answer or moving the concern to another time."], ["A patient says a symptom is “bad.” Which follow-up uses clarification rather than reassurance, focusing, or restatement?", ["“You are saying that it feels bad.”", "“Let us talk first about when it began.”", "“We will make sure the provider hears your concern.”", "“When you say ‘bad,’ what does that mean to you?”"], 3, "Clarification establishes the meaning of an unclear term. Restatement repeats the message; focusing narrows the topic; reassurance offers comfort."], ["A patient says, “Between work and these visits, I cannot keep up.” Which response is restatement?", ["“Which appointment has been hardest to attend?”", "“Balancing work and appointments feels difficult for you.”", "“Would a different appointment time help?”", "“How long has work been this demanding?”"], 1, "Restatement reflects the patient's message in different words. The other responses explore or suggest solutions, which may be useful after understanding is confirmed."], ["A patient says, “I am worried about the results.” Which otherwise well-intended response is the clearest roadblock?", ["“What have you been told about when to expect them?”", "“Would you like a private place to discuss the concern?”", "“I am sure the results will be nothing to worry about.”", "“Waiting sounds difficult; what is your main concern?”"], 2, "False reassurance promises an outcome the MA cannot know and can discourage discussion. Acknowledge uncertainty and explore or route the concern."], ["A patient prefers another language. An adult companion offers to explain everything, but the patient looks uncertain. What is the best next action?", ["Arrange a qualified interpreter and speak directly to the patient", "Ask the companion to translate and have the patient sign afterward", "Use shorter English phrases and rely on gestures for difficult words", "Provide a translated handout and ask the companion to verify understanding"], 0, "A qualified interpreter supports accurate two-way communication. Handouts or a willing companion do not by themselves resolve the patient's communication needs."], ["A patient with hearing difficulty misses parts of instructions while a printer runs behind the MA. Which plan best combines adaptation and verification?", ["Increase volume and ask whether the patient heard every word", "Give the instructions in writing and ask the companion to explain them", "Repeat the full explanation slowly while continuing to face the screen", "Reduce noise, face the patient, ask about helpful aids, and check understanding"], 3, "Address the environment, support the patient's preferred communication method, and verify meaning. Volume or a handout alone may leave the barrier unresolved."], ["At a busy front desk, a patient repeatedly postpones completing a form and says, “I forgot my glasses.” What should the MA do first?", ["Ask whether the patient has trouble reading before offering help", "Discreetly offer to review the form together in a private area", "Ask the companion to fill it out so the line can move", "Provide the same form in larger print and continue check-in"], 1, "Offer help without assuming whether the issue is vision, reading, language, or another concern. Privacy and a neutral offer protect dignity while allowing needs to emerge."], ["A patient with a visual impairment arrives with a companion. Which approach best supports patient-centered communication?", ["Give the companion the information and ask them to read it later", "Read the entire handout aloud before asking about preferences", "Identify yourself, address the patient, and ask what format works best", "Provide large print because it is the standard alternative"], 2, "Do not assume an accessible format or transfer the interaction to a companion. Ask the patient how best to communicate and involve them directly."], ["After watching a demonstration, a patient says, “I think I can do that.” What most directly checks the ability to perform the task?", ["Invite a return demonstration and address any missed steps", "Ask the patient to explain why the task is important", "Ask which teaching method the patient prefers", "Provide a picture checklist and confirm that it is readable"], 0, "A return demonstration provides observable feedback about performance. Preferences, readable materials, and verbal knowledge support teaching but do not establish the ability to carry out the task."], ["A patient cannot explain instructions during teach-back. Which interpretation should guide the MA's response?", ["The patient was not attentive enough during the original explanation", "The handout should replace verbal instruction for the remainder of the visit", "The patient should repeat the explanation until it matches the MA's wording", "The explanation needs adaptation, followed by another check of understanding"], 3, "Treat a teach-back gap as feedback about the teaching. Use simpler language or a different approach, then invite the patient's own explanation again."], ["A patient complains loudly about a wait but has made no threats. Which response is the best first step?", ["Explain the cause of the delay and then ask what the patient needs", "Acknowledge the frustration calmly and offer an appropriate private conversation", "Ask the patient to lower their voice before discussing the issue", "Offer a new appointment before exploring the concern"], 1, "Acknowledgment and calm engagement come before explanations or solutions. Offer privacy when appropriate and safe, then learn what needs to be addressed."], ["An office error caused a patient to arrive at the wrong time. The MA apologizes and corrects the appointment. What best completes service recovery?", ["Explain which staff member caused the error", "Ask the patient to avoid mentioning the error at checkout", "Confirm the corrected plan meets the patient's needs and follow up as appropriate", "Promise priority scheduling for every future visit"], 2, "Service recovery includes follow-through after acknowledgment and correction. Confirm the patient understands the plan and that the practical concern has been addressed."], ["A patient declines a preparation because of a belief the MA does not share. Which action best balances respect and appropriate routing?", ["Clarify the concern respectfully, document it accurately, and notify the provider", "Explain the preparation's benefits until the patient changes their decision", "Ask a family member to persuade the patient before notifying the provider", "Remove the preparation from the plan without discussing it with the provider"], 0, "Respect the concern without pressure, communicate accurately, and involve the provider in decisions about the plan. The MA should not independently alter it."], ["A coworker calls a patient “difficult” before the MA enters. The patient gives short answers. What best avoids acting on bias?", ["Keep the interaction brief to prevent the predicted conflict", "Ask the patient why they were difficult with the previous staff member", "Ask the coworker for more examples before addressing the patient", "Use a neutral invitation to describe concerns and respond to the individual"], 3, "Do not let an inherited label determine the interaction. Explore the patient's own concerns with the same respect and attention given to other patients."], ["A patient repeatedly asks for the MA's personal social-media account after an initial polite refusal. What is the best next step?", ["Share a limited account to preserve rapport", "Restate the professional boundary and follow the practice's process for continued unwanted attention", "Ask a coworker to provide a personal account instead", "Explain private relationship details so the patient understands the refusal"], 1, "Maintain a clear, respectful boundary and use the practice's reporting process when attention continues. Personal disclosure or exceptions can blur the professional relationship."]]}];
const $=id=>document.getElementById(id),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let peer,link,host=false,room='',players=new Map(),phase='home',deck,mode='race',seconds=45,startAt=0,index=0,timer,local=false,ownScore=0,answered=false,session=0;
function note(t){$('notice').textContent=t}
function renderJoinQr(){const box=document.getElementById('joinQr');if(!box)return;try{if(typeof QRCode==='undefined')throw Error('QR unavailable');new QRCode(box,{text:box.dataset.joinUrl,width:220,height:220,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});box.removeAttribute('title')}catch(e){box.textContent='Open the game in Canvas → Module 2, then enter the code.'}}
function view(t){$('app').innerHTML=t;renderJoinQr()}
function ranks(){return [...players.values()].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name)).map(p=>({name:p.name,score:p.score,done:p.i>=deck.questions.length}))}
function board(rows){return '<table><caption>Live leaderboard</caption><thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Points</th></tr></thead><tbody>'+rows.map((p,i)=>'<tr><td>'+ (i+1)+'</td><td>'+esc(p.name)+(p.done?' ✓':'')+'</td><td>'+p.score+'</td></tr>').join('')+'</tbody></table>'}
function broadcast(){const state={type:'board',rows:ranks()};for(const p of players.values())if(p.c?.open)p.c.send(state);if(host)hostView()}
function home(){phase='home';view('<div class="grid"><section class="card"><h2>Play with your class</h2><p>Enter your instructor’s code and a display name. No email or password needed.</p><form id="join"><label>Game code<input id="code" required maxlength="8" autocomplete="off" value="'+esc(new URLSearchParams(location.search).get('room')||'')+'"></label><label>Display name<input id="name" required maxlength="24" autocomplete="nickname"></label><button>Join game</button></form></section><section class="card"><h2>Instructor studio</h2><p>Choose a game, invite students, and start the whole class together.</p><label>Question set<select id="deck">'+decks.map((d,i)=>'<option value="'+i+'">'+esc(d.title)+' · '+d.questions.length+' questions</option>').join('')+'</select></label><label>Play style<select id="mode"><option value="race">Independent race · students advance themselves</option><option value="paced">Instructor paced · one question together</option></select></label><label>Time per question<select id="seconds"><option>15</option><option>25</option><option>30</option><option selected>45</option><option>60</option></select></label><button id="host">Host live game</button> <button class="secondary" id="practice">Try solo</button><p><button class="secondary" id="editor">Create a question set</button></p><p class="muted">Live play uses PeerJS connections. Test on your classroom Wi-Fi before class. Scores stay in this session; download results before closing.</p></section></div>');$('join').onsubmit=e=>{e.preventDefault();join()};$('host').onclick=()=>create(false);$('practice').onclick=()=>create(true);$('editor').onclick=editor}
function editor(){view('<section class="card"><h2>Create a question set</h2><p>Enter a title and edit the example below. Each question needs four choices, a correct answer number from 1–4, and feedback. Save the JSON file to reuse on another computer.</p><label>Title<input id="title" value="My classroom challenge"></label><label>Questions (JSON)<textarea id="json"></textarea></label><button id="use">Use question set</button> <button class="secondary" id="download">Download set</button><label style="margin-top:20px">Load a saved question set<input id="file" type="file" accept=".json,application/json"></label><button class="secondary" id="back">Back</button></section>');$('json').value=JSON.stringify([{question:'Which prefix means slow?',choices:['brady-','tachy-','hyper-','peri-'],answer:1,feedback:'Brady- means slow.'}],null,2);function read(){let q=JSON.parse($('json').value);if(!Array.isArray(q)||!q.length||q.length>100)throw Error('Use 1–100 questions.');q.forEach(x=>{if(typeof x.question!=='string'||!x.question.trim()||!Array.isArray(x.choices)||x.choices.length!==4||x.choices.some(c=>typeof c!=='string'||!c.trim())||!Number.isInteger(x.answer)||x.answer<1||x.answer>4||typeof x.feedback!=='string')throw Error('Check the question format, four choices, answer (1–4), and feedback.');});return {title:$('title').value.trim().slice(0,100)||'My challenge',questions:q}}
$('use').onclick=()=>{try{const d=read();decks.push({title:d.title,questions:d.questions.map(q=>[q.question,q.choices,q.answer-1,q.feedback])});home();$('deck').value=decks.length-1;note('Your question set is ready. Download it from the editor if you want to keep a copy.')}catch(e){note(e.message)}};
$('download').onclick=()=>{try{download('question-set.json',JSON.stringify(read(),null,2),'application/json')}catch(e){note(e.message)}};
$('file').onchange=async()=>{try{const f=$('file').files[0];if(f.size>200000)throw Error('Use a file smaller than 200 KB.');const d=JSON.parse(await f.text());$('title').value=d.title;$('json').value=JSON.stringify(d.questions,null,2);read();note('Loaded. Choose Use question set.')}catch(e){note(e.message)}};$('back').onclick=home}
function download(name,data,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function shuffleDeckAnswers(source){
  return {...source,questions:source.questions.map(([prompt,choices,correct,feedback])=>{
    const order=choices.map((_,i)=>i);
    for(let i=order.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    return [prompt,order.map(i=>choices[i]),order.indexOf(correct),feedback];
  })};
}
function create(solo){deck=shuffleDeckAnswers(decks[Number($('deck').value)]);mode=$('mode').value;seconds=Number($('seconds').value);local=solo;note('');if(solo){host=false;ownScore=0;index=0;phase='playing';question(deck.questions[0],0);return}if(!window.Peer){note('The live connection service did not load. Check your connection or try solo.');return}host=true;phase='lobby';room=Array.from(crypto.getRandomValues(new Uint8Array(6)),n=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[n%32]).join('');peer=new Peer('ivy-cma-'+room);peer.on('open',()=>{hostView();note('Room ready. Students can join now.')});peer.on('error',e=>note('Connection problem: '+e.type+'. Please return home and try again.'));peer.on('connection',c=>{c.on('data',d=>receive(c,d));c.on('close',()=>{let p=players.get(c.peer);if(p){p.c=null;broadcast()}})});view('<section class="card"><h2>Opening your classroom…</h2></section>')}
function hostView(){view('<section class="card"><span class="pill">'+esc(deck.title)+'</span><span class="pill">'+(mode==='race'?'Independent race':'Instructor paced')+'</span><h2>'+(phase==='lobby'?'Your class is invited':phase==='finished'?'Final results':'Game in progress')+'</h2><div class="code">'+room+'</div><div class="join-panel"><div><h3>Scan to join</h3><div id="joinQr" class="join-qr" role="img" aria-label="QR code to join this game" data-join-url="'+esc(location.origin+location.pathname+'?room='+room)+'"></div></div><div class="join-steps"><h3>Or open this game in Canvas</h3><p>Module 2 → select this game</p><p>Enter the <strong>six-character code above</strong> and your display name.</p><a class="button" target="_blank" rel="noopener" href="'+esc(location.origin+location.pathname+'?room='+room)+'">Open student join page</a></div></div><p>'+players.size+' players · '+[...players.values()].filter(p=>p.c?.open).length+' connected</p><div id="controls"></div></section><section class="card" id="hostQuestion"></section><section class="card">'+board(ranks())+'</section>');if(phase==='lobby'){$('controls').innerHTML='<button id="start" '+(!players.size?'disabled':'')+'>Start game</button>';$('start').onclick=()=>{phase='playing';note('Game started. Keep this tab open.');startAt=Date.now();index=0;for(const p of players.values()){p.i=0;p.score=0;sendQuestion(p)}broadcast();if(mode==='paced')schedulePaced()}}else if(phase==='playing'){$('controls').innerHTML='<button id="end">End game and show results</button>';$('end').onclick=finish;if(mode==='paced'){$('hostQuestion').innerHTML='<p>Question '+(index+1)+' of '+deck.questions.length+'</p><h2>'+esc(deck.questions[index][0])+'</h2><div class="answers">'+deck.questions[index][1].map(c=>'<div class="card">'+esc(c)+'</div>').join('')+'</div><p id="hostTime" class="timer"></p>';if([...players.values()].every(p=>p.answered)){$('hostQuestion').innerHTML+='<p>Correct answer: '+esc(deck.questions[index][1][deck.questions[index][2]])+'</p><p>'+esc(deck.questions[index][3])+'</p><button id="next">Next question</button>';$('next').onclick=nextPaced}}else{$('hostQuestion').innerHTML='<h2>Students are racing independently</h2><p>Each question has a '+seconds+'-second limit. Correct answers earn 1,000 points. Faster correct answers earn up to 500 bonus points.</p>'}}else{$('controls').innerHTML='<button id="csv">Download results</button> <button class="secondary" id="again">New game</button>';$('csv').onclick=()=>download('classroom-results.csv','Rank,Display name,Points\r\n'+ranks().map((p,i)=>[i+1,'"'+(' '+p.name).replace(/"/g,'""')+'"',p.score].join(',')).join('\r\n'),'text/csv');$('again').onclick=()=>location.href=location.pathname}}
function receive(c,d){if(!d||typeof d!=='object')return;if(d.type==='join'){if(phase!=='lobby'){c.send({type:'error',message:'This game has started. Join the next round.'});return}if(players.has(c.peer))return;const name=String(d.name||'').trim().slice(0,24);if(!name)return;if([...players.values()].some(p=>p.name.toLowerCase()===name.toLowerCase())){c.send({type:'error',message:'That display name is taken. Add an initial or number.'});return}if(players.size>=60){c.send({type:'error',message:'This room is full.'});return}players.set(c.peer,{c,name,score:0,i:0,answered:false});c.send({type:'welcome',title:deck.title});broadcast()}const p=players.get(c.peer);if(!p||phase!=='playing')return;if(d.type==='answer')grade(p,d);if(d.type==='next'&&mode==='race'&&p.answered){p.i++;sendQuestion(p);broadcast();if([...players.values()].every(x=>x.i>=deck.questions.length))finish()}}
function sendQuestion(p){if(p.i>=deck.questions.length){p.c?.send({type:'done',score:p.score,rows:ranks()});return}p.answered=false;p.result=null;p.sent=Date.now();p.c?.send({type:'question',q:deck.questions[p.i][0],choices:deck.questions[p.i][1],i:p.i,total:deck.questions.length,seconds,mode});}
function grade(p,d){if(p.answered||d.i!==p.i||!Number.isInteger(d.choice)||d.choice< -1||d.choice>3)return;p.answered=true;const q=deck.questions[p.i],elapsed=Date.now()-p.sent,correct=d.choice===q[2]&&elapsed<=seconds*1000;const points=correct?1000+Math.max(0,Math.round(500*(1-elapsed/(seconds*1000)))):0;p.score+=points;p.result={type:'result',correct,answer:q[1][q[2]],feedback:q[3],points,score:p.score,mode};p.c?.send(p.result);broadcast()}
function schedulePaced(){clearTimeout(timer);timer=setTimeout(()=>{for(const p of players.values())if(!p.answered)grade(p,{i:p.i,choice:-1});hostView()},seconds*1000)}
function nextPaced(){index++;if(index>=deck.questions.length){finish();return}for(const p of players.values()){p.i=index;sendQuestion(p)}hostView();schedulePaced()}
function finish(){phase='finished';note('Game ended. Download results before closing this tab.');clearTimeout(timer);for(const p of players.values())p.c?.send({type:'done',score:p.score,rows:ranks()});hostView()}
function join(){if(!window.Peer){note('Live connections are unavailable. Please try again later.');return}const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim();if(!/^[A-Z2-9]{6}$/.test(code)||!name){note('Enter a six-character code and a display name.');return}host=false;local=false;phase='joining';if(peer)peer.destroy();peer=new Peer();note('Connecting to your instructor…');peer.on('open',()=>{link=peer.connect('ivy-cma-'+code,{reliable:true});link.on('open',()=>link.send({type:'join',name}));link.on('data',studentReceive);link.on('close',()=>{clearInterval(timer);note('Disconnected from the instructor. Ask the instructor to start a new round.');document.querySelectorAll('.answers button').forEach(b=>b.disabled=true)})});peer.on('error',()=>note('Could not connect. Check the code and ask your instructor to keep the game open. Your network may block live connections.'));}
let latestRows=[];
function studentReceive(d){if(d.type==='error'){note(d.message);return}if(d.type==='welcome'){note('');phase='lobby';view('<section class="card"><h2>You’re in!</h2><p>'+esc(d.title)+'</p><p>Waiting for your instructor to start…</p></section><section id="leader" class="card"></section>')}if(d.type==='board'){latestRows=d.rows;if($('leader'))$('leader').innerHTML=board(d.rows)}if(d.type==='question'){phase='playing';index=d.i;seconds=d.seconds;mode=d.mode;question([d.q,d.choices],d.i,d.total)}if(d.type==='result')result(d);if(d.type==='done'){clearInterval(timer);phase='finished';view('<section class="card"><h2>Challenge complete!</h2><p class="timer">'+d.score+' points</p><p>Well done—review the feedback and keep practicing.</p></section><section id="leader" class="card">'+board(d.rows)+'</section>')}}
function question(q,i,total=deck?.questions.length){clearInterval(timer);answered=false;const stamp=++session;startAt=Date.now();view('<section class="card"><span class="pill">Question '+(i+1)+' of '+total+'</span><span id="clock" class="timer">'+seconds+'</span><div class="progress"><div id="bar" style="width:100%"></div></div><h2>'+esc(q[0])+'</h2><div class="answers">'+q[1].map((c,j)=>'<button data-choice="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(c)+'</button>').join('')+'</div><div id="feedback" aria-live="polite"></div></section><section id="leader" class="card">'+(latestRows.length?board(latestRows):'Your score will appear after your answer.')+'</section>');document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.choice)));timer=setInterval(()=>{if(stamp!==session)return;const remaining=Math.max(0,seconds-(Date.now()-startAt)/1000);$('clock').textContent=Math.ceil(remaining);$('bar').style.width=(remaining/seconds*100)+'%';if(remaining<=0)answer(-1)},100)}
function answer(choice){if(answered||phase!=='playing')return;answered=true;clearInterval(timer);document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);if(local){const q=deck.questions[index],elapsed=Date.now()-startAt,correct=choice===q[2]&&elapsed<=seconds*1000,points=correct?1000+Math.max(0,Math.round(500*(1-elapsed/(seconds*1000)))):0;ownScore+=points;result({correct,answer:q[1][q[2]],feedback:q[3],points,score:ownScore,mode:'race'})}else if(link?.open){$('feedback').textContent='Answer sent…';link.send({type:'answer',choice,i:index})}}
function result(d){clearInterval(timer);answered=true;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);if(!$('feedback'))return;$('feedback').innerHTML='<h3>'+(d.correct?'Correct! +'+d.points:'Keep learning')+'</h3><p><strong>Answer: '+esc(d.answer)+'</strong></p><p>'+esc(d.feedback)+'</p><p>Total: '+d.score+' points</p>'+(d.mode==='race'?'<button id="continue">Continue</button>':'<p>Wait for your instructor to advance.</p>');if($('continue'))$('continue').onclick=()=>{if(local){index++;if(index<deck.questions.length)question(deck.questions[index],index);else{phase='finished';view('<section class="card"><h2>Practice complete!</h2><p class="timer">'+ownScore+' points</p><button id="home">Back to games</button></section>');$('home').onclick=home}}else{ $('continue').disabled=true;link.send({type:'next'})}}}
window.addEventListener('beforeunload',e=>{if(peer&&phase!=='home'){e.preventDefault();e.returnValue=''}});home();
</script></html>
